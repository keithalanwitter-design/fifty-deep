<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0F1C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="50 Deep">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 52 52'%3E%3Ccircle cx='26' cy='26' r='24' fill='%23FF7A1A'/%3E%3Cg fill='none' stroke='%232a1200' stroke-width='2'%3E%3Cpath d='M2 26h48M26 2v48M9 9c8 8 8 26 0 34M43 9c-8 8-8 26 0 34'/%3E%3C/g%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="icon.png">
<title>50 Deep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
:root{
  --ground:#0A0F1C; --panel:#111A2C; --panel2:#17223A; --line:#24314D;
  --ink:#F3F5FA; --mute:#8D9AB5; --dim:#5A6784;
  --storm:#2E7BFF; --storm-deep:#1649B8; --orange:#FF7A1A; --orange-soft:#FF9E57;
  --bomb:#E3262F; --bomb-deep:#8E1118; --white:#FFFFFF; --good:#34D27B;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --label:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--ground)}
body{color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:14px 60px;display:flex;flex-direction:column;gap:18px}
.lbl{font-family:var(--label);text-transform:uppercase;letter-spacing:.09em;font-weight:600;font-size:13px;color:var(--mute)}
.num{font-family:var(--display);font-variant-numeric:tabular-nums;font-weight:900;line-height:.9}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{margin:0;font-family:var(--display);font-weight:900;font-size:44px;letter-spacing:.01em;line-height:.85;text-transform:uppercase}
.brand h1 b{color:var(--orange)}
.brand small{font-family:var(--label);text-transform:uppercase;letter-spacing:.14em;font-size:12px;color:var(--mute);font-weight:600}
.who{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.who button{padding:7px 14px;border-radius:999px;font-family:var(--label);text-transform:uppercase;letter-spacing:.08em;font-weight:700;font-size:14px;color:var(--mute)}
.who button[aria-pressed="true"].k{background:var(--storm);color:#fff}
.who button[aria-pressed="true"].l{background:var(--bomb);color:#fff}
.iconbtn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;color:var(--mute)}
.iconbtn svg{width:18px;height:18px}

/* scoreboard */
.board{position:relative;border-radius:18px;overflow:hidden;background:
  radial-gradient(120% 90% at 0% 0%,rgba(46,123,255,.28),transparent 55%),
  radial-gradient(120% 90% at 100% 0%,rgba(227,38,47,.26),transparent 55%),
  var(--panel);border:1px solid var(--line)}
.board::before{content:"";position:absolute;left:50%;top:50%;width:230px;height:230px;border:2px solid rgba(255,255,255,.05);border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}
.board::after{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:2px solid rgba(255,255,255,.05);pointer-events:none}
.board-head{position:relative;display:flex;justify-content:center;padding-top:12px}
.weektag{font-family:var(--label);font-weight:700;text-transform:uppercase;letter-spacing:.14em;font-size:13px;background:var(--orange);color:#1a0d00;padding:4px 12px;border-radius:4px}
.sides{position:relative;display:grid;grid-template-columns:1fr auto 1fr;align-items:start;padding:10px 14px 16px;gap:6px}
.side{display:flex;flex-direction:column;gap:6px;min-width:0}
.side.r{align-items:flex-end;text-align:right}
.pname{font-family:var(--display);font-weight:900;font-size:30px;text-transform:uppercase;line-height:1;letter-spacing:.02em}
.side.l .pname{color:#8DB6FF}.side.r .pname{color:#FF8A8F}
.team{font-family:var(--label);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);font-weight:600}
.score{font-size:clamp(54px,15vw,84px);color:var(--white);text-shadow:0 0 24px rgba(255,122,26,.25)}
.score.lead{color:var(--orange-soft)}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.side.r .chips{justify-content:flex-end}
.chip{font-family:var(--label);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:12px;padding:3px 8px;border-radius:4px;background:var(--panel2);border:1px solid var(--line);color:var(--ink);white-space:nowrap}
.chip.heat{background:linear-gradient(90deg,#FF5A00,#FFB23F);border-color:transparent;color:#1a0800}
.chip.streak{border-color:rgba(255,122,26,.5);color:var(--orange-soft)}
.chip.dog{background:var(--good);color:#032012;border-color:transparent}
.vs{align-self:center;display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:6px}
.vs .v{font-family:var(--display);font-weight:900;font-size:22px;color:var(--dim)}
.vs .rec{font-family:var(--label);font-size:12px;letter-spacing:.08em;color:var(--mute);text-align:center;line-height:1.2}
.h2h{position:relative;border-top:1px solid var(--line);padding:12px 14px 14px;display:grid;gap:8px}
.h2h .row{display:grid;grid-template-columns:1fr 92px 1fr;align-items:center;gap:8px}
.bar{height:10px;background:rgba(255,255,255,.06);border-radius:5px;overflow:hidden;display:flex}
.bar.l{justify-content:flex-end}
.bar i{display:block;height:100%;border-radius:5px;transition:width .5s cubic-bezier(.2,.9,.3,1.2)}
.bar.l i{background:linear-gradient(270deg,var(--storm),#6FA3FF)}
.bar.r i{background:linear-gradient(90deg,var(--bomb),#FF6A70)}
.h2h .mid{text-align:center;font-family:var(--label);font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);font-weight:600;line-height:1.1}
.h2h .mid b{display:block;color:var(--ink);font-size:13px}
.h2h-cap{display:flex;justify-content:space-between}

/* coach line */
.coach{display:flex;gap:14px;align-items:center}
.coach .ball{flex:none;width:52px;height:52px}
.coach p{margin:0;font-size:18px;line-height:1.3;font-weight:500;text-wrap:pretty}
.coach p b{font-weight:700;color:var(--orange-soft)}
.coach .sub{display:block;font-size:14px;color:var(--mute);font-weight:500;margin-top:3px}

/* week strip */
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dbtn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px 7px;border-radius:10px;background:var(--panel);border:1px solid var(--line);position:relative;min-width:0}
.dbtn .dn{font-family:var(--label);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:12px;color:var(--mute)}
.dbtn .dd{font-family:var(--display);font-weight:800;font-size:22px;line-height:1}
.dbtn .dots{display:flex;gap:4px}
.dot{width:8px;height:8px;border-radius:50%;background:transparent;border:1.5px solid var(--dim)}
.dot.k.part{border-color:var(--storm)}.dot.k.full{background:var(--storm);border-color:var(--storm)}
.dot.l.part{border-color:var(--bomb)}.dot.l.full{background:var(--bomb);border-color:var(--bomb)}
.dbtn.wknd{background:linear-gradient(180deg,rgba(255,122,26,.13),var(--panel))}
.dbtn .x15{position:absolute;top:-7px;font-family:var(--label);font-size:10px;font-weight:700;background:var(--orange);color:#1a0d00;padding:0 4px;border-radius:3px;letter-spacing:.04em}
.dbtn[aria-current="date"]{border-color:var(--orange);box-shadow:0 0 0 1px var(--orange) inset}
.dbtn.sel{background:var(--ink);color:var(--ground)}
.dbtn.sel .dn{color:var(--ground)}
.dbtn:disabled{opacity:.35;cursor:default}

/* banners */
.banner{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-size:15px}
.banner b{font-family:var(--label);text-transform:uppercase;letter-spacing:.07em;font-size:14px;display:block}
.banner.cb{border-color:rgba(52,210,123,.5);background:linear-gradient(90deg,rgba(52,210,123,.14),var(--panel2))}
.banner.cb b{color:var(--good)}
.banner.wk{border-color:rgba(255,122,26,.5);background:linear-gradient(90deg,rgba(255,122,26,.16),var(--panel2))}
.banner.wk b{color:var(--orange-soft)}
.banner .tag{flex:none;font-family:var(--display);font-weight:900;font-size:26px;line-height:1}

/* day header */
.dayhead{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
.dayhead h2{margin:0;font-family:var(--display);font-weight:900;font-size:32px;text-transform:uppercase;line-height:.95}
.dayhead h2 span{color:var(--mute);font-weight:700}
.rounds{display:flex;align-items:center;gap:8px}
.rounds .pips{display:flex;gap:4px}
.rounds .pips i{width:18px;height:6px;border-radius:3px;background:var(--line)}
.rounds .pips i.on{background:var(--orange)}
.daypts{font-family:var(--display);font-weight:900;font-size:30px;color:var(--orange-soft);line-height:1}

/* exercise cards */
.cards{display:grid;gap:12px}
.card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:12px;overflow:hidden}
.card.done{border-color:rgba(255,122,26,.65);background:radial-gradient(120% 120% at 100% 0%,rgba(255,122,26,.16),transparent 60%),var(--panel)}
.chead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.chead h3{margin:0;font-family:var(--display);font-weight:900;font-size:28px;text-transform:uppercase;line-height:.95;letter-spacing:.01em}
.chead .musc{font-size:13px;color:var(--mute);margin-top:4px}
.count{text-align:right;flex:none}
.count .n{font-family:var(--display);font-weight:900;font-size:40px;line-height:.9;font-variant-numeric:tabular-nums}
.count .n small{font-size:20px;color:var(--mute);font-weight:800}
.count .p{font-family:var(--label);font-size:13px;color:var(--orange-soft);font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.sets{display:flex;flex-wrap:wrap;gap:8px}
.set{position:relative;width:52px;height:52px;border-radius:50%;border:2px dashed var(--dim);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:17px;color:var(--mute);transition:transform .12s;overflow:hidden;isolation:isolate}
.set:active{transform:scale(.9)}
.set .fill{position:absolute;inset:0;background:conic-gradient(var(--orange) var(--pct,0%),transparent 0);z-index:-1;border-radius:50%}
.set.on{border:2px solid var(--orange);background:radial-gradient(circle at 35% 30%,#FFB36B,var(--orange) 55%,#C85200);color:#261000;box-shadow:0 4px 16px rgba(255,122,26,.35)}
.set.on::after{content:"";position:absolute;inset:0;background:
  linear-gradient(transparent 48%,rgba(0,0,0,.28) 48%,rgba(0,0,0,.28) 52%,transparent 52%),
  radial-gradient(circle at 50% -40%,transparent 62%,rgba(0,0,0,.26) 63%,rgba(0,0,0,.26) 66%,transparent 67%),
  radial-gradient(circle at 50% 140%,transparent 62%,rgba(0,0,0,.26) 63%,rgba(0,0,0,.26) 66%,transparent 67%);border-radius:50%;pointer-events:none}
.set .sl{position:relative;z-index:2}
.set.on .sl{background:rgba(255,190,130,.9);padding:0 3px;border-radius:4px;line-height:1.1}
.set.extra.on .sl{background:rgba(160,240,190,.9)}
.set.part{border-style:solid;border-color:var(--orange)}
.set.extra{border-color:var(--good)}
.set.extra.on{background:radial-gradient(circle at 35% 30%,#8BF0B6,var(--good) 55%,#16874A);border-color:var(--good);color:#032012}
.set.pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{font-family:var(--label);font-weight:700;text-transform:uppercase;letter-spacing:.07em;font-size:14px;padding:10px 14px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);display:inline-flex;align-items:center;gap:6px}
.btn.go{background:var(--storm);border-color:var(--storm);color:#fff}
.me-logan .btn.go{background:var(--bomb);border-color:var(--bomb)}
.btn.yes{border-color:rgba(255,122,26,.6);color:var(--orange-soft)}
.btn.no{color:var(--mute)}
.btn:disabled{opacity:.4;cursor:default}
.entry{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--panel2);border-radius:10px;padding:10px}
.entry label{font-size:14px;color:var(--mute);flex:1 1 150px}
.entry input{width:90px;font:inherit;font-family:var(--display);font-weight:800;font-size:24px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--ground);color:var(--ink)}
.stamp{position:absolute;right:14px;bottom:10px;font-family:var(--display);font-weight:900;font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:var(--orange);border:2px solid var(--orange);padding:2px 8px;border-radius:4px;transform:rotate(-6deg);opacity:.9;pointer-events:none}
.stamp.slam{animation:slam .55s cubic-bezier(.2,1.4,.4,1)}
@keyframes slam{0%{transform:rotate(-6deg) scale(3);opacity:0}100%{transform:rotate(-6deg) scale(1);opacity:.9}}
.readonly{font-size:14px;color:var(--mute)}

/* tabs */
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.tabs button{padding:10px 2px;white-space:nowrap;border-radius:9px;font-family:var(--label);font-weight:700;text-transform:uppercase;letter-spacing:.05em;font-size:13px;color:var(--mute);display:flex;align-items:center;justify-content:center;gap:4px}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--ground)}
.tc{font-size:11px;background:var(--orange);color:#1a0d00;border-radius:999px;padding:0 6px;line-height:16px}
.tc.due{background:var(--good);color:#032012}
.sech{margin:0;font-family:var(--display);font-weight:900;font-size:32px;text-transform:uppercase;line-height:.95}
.intro{margin:0;color:#C9D1E3;font-size:15px;max-width:62ch}
.linkbtn{font-family:var(--label);font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--good);padding:0;margin-top:4px;display:inline-block}
.banner.test{border-color:rgba(52,210,123,.5);background:linear-gradient(90deg,rgba(52,210,123,.14),var(--panel2))}
.banner.test b{color:var(--good)}
.banner.test .tag{font-size:20px;color:var(--good)}
/* tests */
.tcard{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:12px}
.tcard.open{border-color:rgba(52,210,123,.55)}
.thead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.thead h3{margin:0;font-family:var(--display);font-weight:900;font-size:26px;text-transform:uppercase;line-height:1}
.trow{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.trow .tn{font-family:var(--display);font-weight:800;font-size:22px;text-transform:uppercase}
.trow .tv{font-family:var(--display);font-weight:900;font-size:34px;font-variant-numeric:tabular-nums;min-width:48px;text-align:right}
.trow .tv.none{color:var(--dim)}
.cmp{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.cmp th{font-family:var(--label);text-transform:uppercase;letter-spacing:.08em;font-size:12px;color:var(--mute);font-weight:600;text-align:right;padding:4px 6px}
.cmp th:first-child,.cmp td:first-child{text-align:left}
.cmp td{padding:8px 6px;border-top:1px solid var(--line);text-align:right;font-size:15px}
.cmp td b{font-family:var(--display);font-weight:900;font-size:24px}
.cmp .k b{color:#8DB6FF}.cmp .l b{color:#FF8A8F}
.up{display:block;font-size:12px;color:var(--good);font-weight:700}
.up.dn{color:var(--bomb)}
.locked{color:var(--dim);font-size:14px}
/* runner */
.runner{position:fixed;inset:0;z-index:48;background:radial-gradient(90% 60% at 50% 30%,rgba(255,122,26,.18),transparent 70%),var(--ground);display:flex;flex-direction:column;align-items:center;padding:calc(18px + env(safe-area-inset-top,0px)) 16px calc(18px + env(safe-area-inset-bottom,0px));gap:12px;overflow:auto}
.runner .rt{font-family:var(--display);font-weight:900;font-size:30px;text-transform:uppercase;text-align:center;line-height:1}
.runner .clock{font-family:var(--display);font-weight:900;font-size:clamp(90px,30vw,150px);line-height:.9;font-variant-numeric:tabular-nums}
.runner .clock.warn{color:var(--orange)}
.runner .pad{width:min(100%,420px);flex:1;min-height:200px;max-height:340px;border-radius:24px;border:3px solid var(--orange);background:rgba(255,122,26,.08);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.runner .pad:active{background:rgba(255,122,26,.2)}
.runner .pad .c{font-family:var(--display);font-weight:900;font-size:96px;line-height:.9;font-variant-numeric:tabular-nums}
.runner .row2{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:min(100%,420px)}
.runner .row2 .btn{flex:1;justify-content:center}
.runner input{width:120px;font-family:var(--display);font-weight:900;font-size:44px;text-align:center;padding:6px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.runner .cue{max-width:420px;text-align:center;color:#C9D1E3;font-size:15px;margin:0}
/* badges */
.bsum{display:flex;gap:10px;flex-wrap:wrap}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.badge{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:12px 6px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}
.medal{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:24px;color:#1f0d00;
  background:radial-gradient(circle at 35% 30%,#FFD9A8,#FF8A2A 55%,#B84A00);box-shadow:0 0 0 3px var(--panel),0 0 0 5px var(--orange),0 6px 18px rgba(255,122,26,.35)}
.badge.storm .medal{background:radial-gradient(circle at 35% 30%,#BFD6FF,#2E7BFF 55%,#123A8F);color:#fff;box-shadow:0 0 0 3px var(--panel),0 0 0 5px var(--storm),0 6px 18px rgba(46,123,255,.35)}
.badge.bomb .medal{background:radial-gradient(circle at 35% 30%,#FFC2C4,#E3262F 55%,#6E0B10);color:#fff;box-shadow:0 0 0 3px var(--panel),0 0 0 5px var(--bomb),0 6px 18px rgba(227,38,47,.35)}
.badge .bn{font-family:var(--label);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:14px;line-height:1.1}
.badge .bd{font-size:12px;color:var(--mute);line-height:1.25}
.badge.off .medal{background:var(--panel2);color:var(--dim);box-shadow:0 0 0 3px var(--panel),0 0 0 5px var(--line)}
.badge.off .bn{color:var(--mute)}
.badge .who2{display:flex;gap:4px}
/* rules */
.rules{display:grid;gap:14px}
details.rules summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;font-family:var(--display);font-weight:900;font-size:24px;text-transform:uppercase}
details.rules summary::-webkit-details-marker{display:none}
details.rules summary span{font-family:var(--label);font-size:13px;color:var(--mute);letter-spacing:.08em}
.rulebody{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:14px}
.rule h4{margin:0 0 3px;font-family:var(--label);font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:15px;color:var(--orange-soft)}
.rule p{margin:0;color:#C9D1E3;font-size:15px;max-width:62ch}
.ladder{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.foot{text-align:center;color:var(--dim);font-size:14px;font-style:italic;padding-top:4px}
.save{font-size:12px;color:var(--dim);text-align:center}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(3,6,14,.72);backdrop-filter:blur(3px);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px));display:grid;gap:14px;animation:up .28s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h3{margin:0;font-family:var(--display);font-weight:900;font-size:34px;text-transform:uppercase;line-height:.95}
.sheet .why{background:var(--panel2);border-radius:10px;padding:10px 12px;font-size:15px;color:#C9D1E3}
.sheet .why b{color:var(--orange-soft)}
.sheet ol,.sheet ul{margin:0;padding-left:22px;display:grid;gap:7px;font-size:16px}
.sheet ul.miss li::marker{color:var(--bomb)}
.sheet .big{font-family:var(--display);font-weight:900;font-size:24px;text-transform:uppercase;letter-spacing:.03em;padding:16px;border-radius:14px;background:linear-gradient(180deg,#FF923F,var(--orange));color:#211000;width:100%}
.timer{display:flex;align-items:center;gap:16px;justify-content:center}
.timer .t{font-family:var(--display);font-weight:900;font-size:64px;font-variant-numeric:tabular-nums;line-height:1}
.pick{position:fixed;inset:0;z-index:50;background:rgba(5,8,16,.92);display:grid;place-items:center;padding:16px}
.pick .box{max-width:420px;width:100%;display:grid;gap:14px;text-align:center}
.pick h2{margin:0;font-family:var(--display);font-weight:900;font-size:40px;text-transform:uppercase;line-height:.95}
.pick .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick .two button{padding:22px 10px;border-radius:16px;font-family:var(--display);font-weight:900;font-size:30px;text-transform:uppercase;color:#fff}
.pick .two .k{background:linear-gradient(160deg,var(--storm),var(--storm-deep))}
.pick .two .l{background:linear-gradient(160deg,var(--bomb),var(--bomb-deep))}
.pick .two small{display:block;font-family:var(--label);font-size:13px;letter-spacing:.12em;font-weight:600;opacity:.85}

/* celebration */
#fx{position:fixed;inset:0;pointer-events:none;z-index:60}
.hype{position:fixed;inset:0;z-index:55;display:grid;place-items:center;pointer-events:none}
.hype .in{text-align:center;animation:hype 2.4s cubic-bezier(.2,1.2,.3,1) forwards;padding:16px}
.hype .big{font-family:var(--display);font-weight:900;font-size:clamp(64px,20vw,130px);line-height:.85;text-transform:uppercase;color:#fff;
  text-shadow:0 0 0 #000,4px 4px 0 var(--orange),8px 8px 0 var(--storm-deep),0 0 40px rgba(255,122,26,.6)}
.hype .small{font-family:var(--label);font-weight:700;text-transform:uppercase;letter-spacing:.16em;font-size:18px;color:var(--orange-soft);margin-top:10px}
@keyframes hype{0%{transform:scale(.3) rotate(-8deg);opacity:0}15%{transform:scale(1.08) rotate(2deg);opacity:1}25%{transform:scale(1) rotate(0)}80%{opacity:1}100%{opacity:0;transform:scale(1.05)}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--ground);font-weight:600;padding:10px 16px;border-radius:999px;z-index:58;font-size:15px;animation:up .25s;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition:none!important}}
@media (max-width:420px){.pname{font-size:24px}.set{width:46px;height:46px}.chead h3{font-size:24px}.h2h .row{grid-template-columns:1fr 78px 1fr}}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
.pin{display:flex;gap:8px;justify-content:center}
.pin input{width:150px;text-align:center;letter-spacing:.4em;font-family:var(--display);font-weight:900;font-size:40px;padding:8px;border-radius:12px;border:1px solid var(--line);background:var(--ground);color:var(--ink)}

<body>

<div id="app"></div>

<script>
(() => {
"use strict";
/* ================= CONFIG ================= */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBPVyPhfu5XzA_x65X11cG7x_8qQ3kF2Yc",
  authDomain: "fifty-deep.firebaseapp.com",
  projectId: "fifty-deep",
  storageBucket: "fifty-deep.firebasestorage.app",
  messagingSenderId: "1071802329438",
  appId: "1:1071802329438:web:8ee2e5b6d5630b07a087cf"
};
const FAMILY_PIN = "2026";                    // needed once per phone to log reps
const SEASON_START = "2026-09-21";            // Monday, Week 1
const HOT_BONUS = [100, 150, 200];           // flat bonus for 1st, 2nd, 3rd+ perfect week in a row
const TEST_EVERY = 30;                        // days between max-out tests
const TEST_PTS = 5;                           // points per rep improved over your last test
const TEST_EX = ["push","sit","squat"];
const P = {
  keith: { id:"keith", name:"Keith", team:"Storm", side:"l" },
  logan: { id:"logan", name:"Logan", team:"Bombers", side:"r" }
};
const EX = [
  { id:"push", name:"Push-ups", per:10, target:50, pts:1, unit:"reps", short:"Push",
    musc:"Chest · shoulders · triceps",
    hoops:"Finishing through contact, holding your spot in the post, and a stronger push off the floor on rebounds.",
    cues:["Hands just outside your shoulders, fingers spread and gripping the floor.",
          "Body is one straight plank from head to heels. Squeeze your glutes and brace your abs like you're about to take a charge.",
          "Elbows tuck about 45° from your body, not flared out like a T.",
          "Lower slow (2 seconds) until your chest is a fist-height off the floor.",
          "Push the floor away and lock out at the top. Breathe out on the way up."],
    miss:["Hips sagging or piked up in the air.","Half reps. Ten real ones beat twenty fake ones.","Head dropping first. Keep your eyes a little ahead of your hands."] },
  { id:"sit", name:"Sit-ups", per:10, target:50, pts:1, unit:"reps", short:"Sit",
    musc:"Core · abs · lower back",
    hoops:"Your core is your balance in the air. It's what keeps you from getting knocked off your line on drives and lets you finish through bumps.",
    cues:["Knees bent about 90°, feet flat on the floor (anchor them under a couch if you need to).",
          "Arms crossed on your chest, or fingertips lightly behind your ears. Never yank on your neck.",
          "Curl up one vertebra at a time, leading with your chest, not your chin.",
          "Come all the way up, then lower down slow, about 2–3 seconds, with control.",
          "Breathe out on the way up, in on the way down."],
    miss:["Pulling your head forward with your hands.","Flopping back down fast. The slow lower is half the work.","Feet flying up. That means you're using momentum, not core."] },
  { id:"squat", name:"Squats", per:10, target:50, pts:1, unit:"reps", short:"Squat",
    musc:"Quads · glutes · hamstrings",
    hoops:"This is your defensive stance, your first step and your vertical. Strong legs in the 4th quarter win games.",
    cues:["Feet shoulder-width, toes turned out slightly.",
          "Sit back and down like you're reaching for a chair behind you.",
          "Knees track out over your toes. Never let them cave inward.",
          "Chest up, back flat, weight in your heels and mid-foot. You should be able to wiggle your toes.",
          "Go down until your thighs are parallel to the floor, then drive up through your heels and squeeze your glutes at the top."],
    miss:["Knees collapsing in toward each other.","Heels lifting off the floor.","Rounding your back or dropping your chest."] },
  { id:"rope", name:"Jump Rope", per:1, target:5, pts:10, unit:"min", short:"Rope",
    musc:"Cardio · calves · foot speed",
    hoops:"Quick feet, light feet. Rope builds the bounce and conditioning that keeps you sharp on defense when everyone else is tired.",
    cues:["Elbows stay close to your sides. Turn the rope with your wrists, not your whole arms.",
          "Small hops, an inch or two off the ground, on the balls of your feet.",
          "Knees soft, stay light and quiet. Loud landings mean heavy feet.",
          "Eyes forward, chest tall, like you're reading the defense.",
          "Start with the basic bounce. When that's easy, try the boxer skip or alternate feet."],
    miss:["Jumping way too high.","Big arm circles. Keep it in the wrists.","Landing flat-footed on your heels."] }
];
const EXID = EX.map(e => e.id);
const ROUNDS = 5;

/* ================= DATES ================= */
const pad = n => String(n).padStart(2, "0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate()+n); return iso(d); };
const todayStr = () => iso(new Date());
const dow = s => parse(s).getDay();                 // 0 Sun … 6 Sat
const isWknd = s => { const w = dow(s); return w === 0 || w === 6; };
const daysBetween = (a, b) => Math.round((parse(b) - parse(a)) / 864e5);
const weekIdx = s => Math.floor(daysBetween(SEASON_START, s) / 7);
const weekStart = w => addDays(SEASON_START, w*7);
const DN = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const DNL = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];

/* ================= STORAGE ================= */
const LS = {
  get(k, d){ try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
let logs = {};                        // "keith|2026-09-21" -> {push,sit,squat,rope}
let tests = {};                       // "keith|1" -> {push,sit,squat,date}
let testsCol = null;
let local = {};                       // optimistic overrides waiting to save
let db = null, dbCol = null, shared = false, canWrite = true;
const pending = {};                   // debounce timers per key
const writing = {};                   // per-key serial writes

function vals(p, d){
  const k = p+"|"+d, v = local[k] || logs[k] || {};
  return { push:+v.push||0, sit:+v.sit||0, squat:+v.squat||0, rope:+v.rope||0 };
}
function setVals(p, d, v){
  const k = p+"|"+d;
  local[k] = v;
  if (!shared){ const all = LS.get("fd_logs", {}); all[k] = v; LS.set("fd_logs", all); return; }
  clearTimeout(pending[k]);
  pending[k] = setTimeout(() => flush(p, d), 650);
}
async function flush(p, d){
  const k = p+"|"+d;
  if (writing[k]) { pending[k] = setTimeout(() => flush(p, d), 300); return; }
  const v = local[k]; if (!v) return;
  writing[k] = true;
  try {
    await dbCol.doc(p+"_"+d).set({ player:p, date:d, ...v, updatedAt:Date.now() });
    logs[k] = v;
    if (local[k] === v) delete local[k];
  } catch (e) {
    if (e && (e.code === "invalid_argument" || e.code === "permission-denied")) { toast("That entry was rejected by the scoreboard. Refresh and try again."); }
    else if (e && e.code === "unavailable") { setTimeout(() => flush(p, d), 1500); }
    else toast("Couldn't save just now. Your reps are kept on screen, try again in a sec.");
  } finally { writing[k] = false; }
}

/* ================= GAME ENGINE ================= */
const full = v => EX.every(e => v[e.id] >= e.target);
function compute(){
  const today = todayStr();
  const last = today < SEASON_START ? SEASON_START : today;
  const dates = []; for (let d = SEASON_START; d <= last; d = addDays(d,1)) dates.push(d);
  const M = { today, dates, players:{}, weeks:[] };
  const nWeeks = weekIdx(last) + 1;

  for (const p of ["keith","logan"]){
    const days = {};
    for (const d of dates){
      const v = vals(p, d), wk = isWknd(d), prev = addDays(d,-1);
      const need = { push:0, sit:0, squat:0, rope:0 };
      if (prev >= SEASON_START && !isWknd(prev)){
        const pv = vals(p, prev);
        if (!full(pv)) EX.forEach(e => need[e.id] = Math.max(0, e.target - pv[e.id]));
      }
      const cap = {}; EX.forEach(e => cap[e.id] = wk ? Infinity : e.target + need[e.id]);
      days[d] = { d, v, wk, need, cap, full: full(v), comeback: EXID.some(id => need[id] > 0) };
    }
    for (const d of dates){
      const x = days[d], nx = days[addDays(d,1)];
      x.recovered = !x.wk && !x.full && !!nx && EX.every(e => nx.v[e.id] >= e.target + nx.need[e.id]);
      x.ok = x.full || x.recovered;
      x.base = EX.reduce((s,e) => s + Math.min(x.v[e.id], x.cap[e.id]) * e.pts, 0);
      x.sets = EX.map(e => Math.floor(Math.min(x.v[e.id], e.target) / e.per));
      x.rounds = Math.min(...x.sets);
    }
    // streak
    let s = 0, best = 0, onLine = false;
    const yest = addDays(today,-1);
    for (const d of dates){
      const x = days[d];
      if (x.wk){ if (x.full) s++; }
      else if (x.ok) s++;
      else if (d === today) {}
      else if (d === yest && today >= SEASON_START) { onLine = true; }
      else s = 0;
      best = Math.max(best, s);
    }
    M.players[p] = { days, streak:s, best, onLine, chain:[], bonus:[], testBonus:[], weekPts:[], weekdayPts:[], perfect:[], okCount:[] };
  }

  // tests: improvement bonus lands in the week the retest is logged
  for (const p of ["keith","logan"]){
    const pl = M.players[p]; pl.tests = testList(p);
    pl.tests.forEach((t,i) => { t.gain = 0; if (i > 0){ const pr = pl.tests[i-1];
      t.gain = TEST_EX.reduce((s,id) => s + Math.max(0, (t[id]||0) - (pr[id]||0)), 0) * TEST_PTS; } });
  }
  // weeks: hot streak bonus, points, underdog weekends
  for (let w = 0; w < nWeeks; w++){
    const wd = []; for (let i = 0; i < 7; i++) wd.push(addDays(weekStart(w), i));
    const inSeason = wd.filter(d => d <= last);
    for (const p of ["keith","logan"]){
      const pl = M.players[p];
      const weekdays = wd.slice(0,5);
      pl.okCount[w] = weekdays.filter(d => pl.days[d] && pl.days[d].ok).length;
      pl.perfect[w] = pl.okCount[w] === 5;
      pl.chain[w] = pl.perfect[w] ? (w ? pl.chain[w-1] : 0) + 1 : 0;
      pl.bonus[w] = pl.perfect[w] ? HOT_BONUS[Math.min(pl.chain[w], 3) - 1] : 0;
      pl.weekdayPts[w] = weekdays.filter(d => pl.days[d]).reduce((s,d) => s + pl.days[d].base, 0);
    }
    const K = M.players.keith, L = M.players.logan;
    const dog = K.weekdayPts[w] < L.weekdayPts[w] ? "keith" : L.weekdayPts[w] < K.weekdayPts[w] ? "logan" : null;
    for (const p of ["keith","logan"]){
      const pl = M.players[p]; let tot = 0;
      for (const d of inSeason){
        const x = pl.days[d];
        const wm = x.wk ? (dog === p ? 2 : 1.5) : 1;
        x.mult = wm; x.wkMult = wm;
        x.pts = Math.round(x.base * x.mult);
        tot += x.pts;
      }
      pl.testBonus[w] = pl.tests.filter(t => t.date && weekIdx(t.date) === w).reduce((s,t) => s + t.gain, 0);
      pl.weekPts[w] = tot + pl.bonus[w] + pl.testBonus[w];
    }
    M.weeks.push({ w, dates:wd, dog, complete: addDays(weekStart(w),6) < today });
  }
  // season record from completed weeks
  const rec = { keith:0, logan:0, tie:0 };
  M.weeks.filter(x => x.complete).forEach(x => {
    const a = M.players.keith.weekPts[x.w], b = M.players.logan.weekPts[x.w];
    if (a > b) rec.keith++; else if (b > a) rec.logan++; else rec.tie++;
  });
  M.rec = rec;
  return M;
}

/* ================= UI STATE ================= */
let me = LS.get("fd_me", null);
let selDate = null;
let sound = LS.get("fd_sound", true);
let tab = LS.get("fd_tab", "today");
let pinOK = LS.get("fd_pin", "") === FAMILY_PIN;
let pinOpen = false;
let openEntry = null;         // exercise id with the "didn't get it" box open
let sheet = null;             // {ex}
let popAt = null;             // {ex, i}
let slamEx = null;
let M = null;

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const other = p => p === "keith" ? "logan" : "keith";
const fmt = n => Math.round(n).toLocaleString();

/* ================= RENDER ================= */
const app = document.getElementById("app");
function render(){
  M = compute();
  const today = M.today;
  if (!selDate || selDate > M.dates[M.dates.length-1]) selDate = today < SEASON_START ? SEASON_START : today;
  const w = weekIdx(selDate), wk = M.weeks[w];
  const K = M.players.keith, L = M.players.logan;
  document.body.className = me ? "me-"+me : "";

  const heatChip = (pl) => pl.perfect[w] ? `<span class="chip heat">Hot streak +${pl.bonus[w]}</span>` : `<span class="chip">Hot ${pl.okCount[w]}/5</span>`;
  const streakChip = (pl) => `<span class="chip streak">${pl.streak} day streak${pl.onLine ? " · on the line" : ""}</span>`;
  const wkndReached = wk.dates[5] <= today;
  const dogChip = (p) => wk.dog === p && wkndReached ? `<span class="chip dog">Underdog 2x wknd</span>` : "";
  const kp = K.weekPts[w], lp = L.weekPts[w];

  const bars = EX.map(e => {
    const kv = K.days[selDate].v[e.id], lv = L.days[selDate].v[e.id];
    const mx = Math.max(e.target, kv, lv);
    return `<div class="row">
      <div class="bar l"><i style="width:${Math.min(100, kv/mx*100)}%"></i></div>
      <div class="mid"><b>${kv} · ${lv}</b>${e.short}${e.unit==="min"?" min":""}</div>
      <div class="bar r"><i style="width:${Math.min(100, lv/mx*100)}%"></i></div></div>`;
  }).join("");

  const strip = wk.dates.map(d => {
    const disabled = d > today || d < SEASON_START;
    const dot = (p, cls) => { const x = M.players[p].days[d]; if (!x) return `<i class="dot ${cls}"></i>`;
      return `<i class="dot ${cls} ${x.full || x.recovered ? "full" : x.base > 0 ? "part" : ""}"></i>`; };
    return `<button class="dbtn ${isWknd(d) ? "wknd" : ""} ${d===selDate ? "sel" : ""}" data-day="${d}" ${d===today ? 'aria-current="date"' : ""} ${disabled ? "disabled" : ""} aria-label="${DNL[dow(d)]} ${d}">
      ${isWknd(d) ? `<span class="x15">1.5x</span>` : ""}
      <span class="dn">${DN[dow(d)]}</span><span class="dd">${parse(d).getDate()}</span>
      <span class="dots">${dot("keith","k")}${dot("logan","l")}</span></button>`;
  }).join("");

  // ---- my day
  let dayHtml = "";
  if (me){
    const pl = M.players[me], x = pl.days[selDate];
    const isToday = selDate === today;
    const edit = canWrite;
    const banners = [];
    if (x.comeback){
      const miss = EX.filter(e => x.need[e.id] > 0).map(e => `${x.need[e.id]} ${e.unit==="min" ? "min of rope" : e.name.toLowerCase()}`).join(", ");
      const prevName = DNL[dow(addDays(selDate,-1))];
      banners.push(`<div class="banner cb"><span class="tag">↺</span><div><b>${x.recovered || pl.days[addDays(selDate,-1)].recovered ? "Comeback complete" : "Comeback day"}</b>${pl.days[addDays(selDate,-1)].recovered
        ? `${prevName} is recovered and your streak is safe. That's how you respond.`
        : `${prevName} came up short: ${miss}. Do them today on top of your normal 50 and ${prevName} counts as a full day again. Your streak stays alive and the make-up reps score points.`}</div></div>`);
    }
    if (x.wk){
      const dogMe = wk.dog === me;
      banners.push(`<div class="banner wk"><span class="tag">${dogMe ? "2x" : "1.5x"}</span><div><b>${dogMe ? "Underdog weekend" : "Bonus day. No cap."}</b>${dogMe
        ? `You're behind on weekday points this week, so your weekend reps score double. Go take the lead back.`
        : `Do as many as you want. Every rep counts 1.5x. Full sets of 50 on each still count toward your streak.`}</div></div>`);
    }
    const cards = EX.map(e => {
      const v = x.v[e.id], cap = x.cap[e.id];
      const goal = x.wk ? e.target : e.target + x.need[e.id];
      const done = v >= goal;
      const setsReg = e.target / e.per, extra = x.wk ? 0 : Math.ceil(x.need[e.id] / e.per);
      let total = x.wk ? Math.max(setsReg, Math.floor(v / e.per) + 1) : setsReg + extra;
      let bubbles = "";
      for (let i = 0; i < total; i++){
        const lo = i*e.per, hi = (i+1)*e.per;
        const on = v >= hi, part = !on && v > lo;
        const isExtra = !x.wk && i >= setsReg;
        const pct = part ? Math.round((v-lo)/e.per*100) : 0;
        const label = e.unit === "min" ? `${i+1}′` : hi;
        const pop = popAt && popAt.ex === e.id && popAt.i === i ? " pop" : "";
        bubbles += `<button class="set ${on ? "on" : ""} ${part ? "part" : ""} ${isExtra ? "extra" : ""}${pop}" data-set="${e.id}" data-i="${i}" ${edit ? "" : "disabled"}
          aria-label="${e.name} ${e.unit === "min" ? "minute" : "set"} ${i+1}${isExtra ? " (make-up)" : ""}${on ? ", done" : ""}" aria-pressed="${on}">
          ${part ? `<span class="fill" style="--pct:${pct}%"></span>` : ""}<span class="sl">${label}</span></button>`;
      }
      const shownGoal = x.wk ? `${e.target}+` : goal;
      const ptsNow = Math.round(Math.min(v, cap) * e.pts * x.mult);
      const entryOpen = openEntry === e.id;
      return `<article class="card ${done ? "done" : ""}" data-card="${e.id}">
        <div class="chead"><div><h3>${e.name}</h3><div class="musc">${e.musc}</div></div>
          <div class="count"><div class="n">${v}<small>/${shownGoal}${e.unit==="min"?" min":""}</small></div><div class="p">+${fmt(ptsNow)} pts</div></div></div>
        <div class="sets">${bubbles}</div>
        ${edit ? `<div class="actions">

/* ================= MAX-OUT TESTS ================= */
const openTestK = () => Math.max(1, Math.floor(daysBetween(SEASON_START, todayStr()) / TEST_EVERY) + 1);
const testOpens = k => addDays(SEASON_START, TEST_EVERY * (k-1));
const testLabel = k => k === 1 ? "Baseline" : `Day ${TEST_EVERY*(k-1)} retest`;
function testList(p){
  const out = [];
  for (let k = 1; k <= openTestK(); k++){ const t = tests[p+"|"+k]; if (t && TEST_EX.some(id => t[id] > 0)) out.push({ k, ...t }); }
  return out;
}
function testDue(){
  if (!me) return 0;
  const k = openTestK(), t = tests[me+"|"+k] || {};
  return TEST_EX.every(id => t[id] > 0) ? 0 : k;
}
async function saveTest(k, exId, n){
  const key = me+"|"+k, cur = tests[key] || {};
  const obj = { push:cur.push||0, sit:cur.sit||0, squat:cur.squat||0, date: cur.date || todayStr(), [exId]: n };
  tests[key] = obj;
  if (!shared){ LS.set("fd_tests", tests); return; }
  try { await testsCol.doc(`${me}_t${k}`).set({ player:me, k, ...obj, updatedAt:Date.now() }); }
  catch (e) { toast("Couldn't save the test just now. Try again in a sec."); }
}
function testsHtml(){
  const K = openTestK(), today = M.today;
  const mine = me ? (tests[me+"|"+K] || {}) : {};
  const prevMine = me && K > 1 ? (tests[me+"|"+(K-1)] || {}) : null;
  const nextOpen = testOpens(K+1), inDays = daysBetween(today, nextOpen);
  let h = `<section class="tcard" style="background:transparent;border:0;padding:0">
    <h2 class="sech">Max-Out Tests</h2>
    <p class="intro">One minute each, all-out, good form only. Bad-form reps don't count, and the honor system says so. Rest 2–3 minutes between exercises. The first test is your baseline, then you retest every ${TEST_EVERY} days to see how much stronger you got. Every retest pays ${TEST_PTS} points for each rep you beat your last test by.</p></section>`;
  if (me){
    h += `<section class="tcard open"><div class="thead"><h3>${P[me].name}: Test ${K}</h3><span class="lbl">${testLabel(K)} · open now</span></div>
      ${TEST_EX.map(id => { const e = EX.find(z => z.id === id), v = mine[id] || 0, pv = prevMine ? prevMine[id] || 0 : 0;
        return `<div class="trow"><div><div class="tn">${e.name}</div>${v && prevMine && pv ? `<span class="up ${v < pv ? "dn" : ""}">${v >= pv ? "+" : ""}${v - pv} vs last test</span>` : prevMine && pv ? `<span class="locked">Last test: ${pv}</span>` : ""}</div>
          <div class="tv ${v ? "" : "none"}">${v || "—"}</div>
          <button class="btn ${v ? "" : "go"}" data-run="${id}">${v ? "Redo" : "Run 1:00"}</button></div>`; }).join("")}
      <div class="locked">Test ${K+1} (${testLabel(K+1)}) opens ${parse(nextOpen).toLocaleDateString(undefined,{month:"short",day:"numeric"})}, in ${inDays} day${inDays === 1 ? "" : "s"}.</div>
    </section>`;
  }
  for (let k = K; k >= 1; k--){
    const tk = tests["keith|"+k] || {}, tl = tests["logan|"+k] || {};
    const bk = tests["keith|1"] || {}, bl = tests["logan|1"] || {};

/* runner: full-screen 1-minute test */
let run = null;
function openRunner(exId){
  run = { k: openTestK(), ex: exId, phase: "ready", count: 0, left: 60, iv: null };
  let el = document.getElementById("runner");
  if (!el){ el = document.createElement("div"); el.id = "runner"; el.className = "runner"; el.setAttribute("role","dialog"); el.setAttribute("aria-modal","true"); document.body.appendChild(el);
    el.addEventListener("click", runnerClick); el.addEventListener("pointerdown", ev => { if (ev.target.closest(".pad") && run && run.phase === "go"){ run.count++; sfx("tap"); buzz(8); const c = el.querySelector(".pad .c"); if (c) c.textContent = run.count; } }); }
  drawRunner();
}
function drawRunner(){
  const el = document.getElementById("runner"); if (!el || !run) return;
  const e = EX.find(z => z.id === run.ex), mm = `${Math.floor(run.left/60)}:${pad(run.left%60)}`;
  const prev = run.k > 1 ? (tests[me+"|"+(run.k-1)] || {})[run.ex] : 0;
  let body = "";
  if (run.phase === "ready") body = `
    <div class="lbl">Test ${run.k} · ${testLabel(run.k)}</div><div class="rt">${e.name}<br>1 minute max</div>
    <div class="clock">1:00</div>
    <p class="cue">${esc(e.cues[1])} ${prev ? `Number to beat: <b>${prev}</b>.` : ""}</p>
    <p class="cue" style="color:var(--mute)">A partner can tap the big pad for every rep, or just type your count when the clock hits zero.</p>
    <div class="row2"><button class="btn go" data-r="start" style="font-size:18px;padding:16px">Start · 3, 2, 1</button></div>
    <div class="row2"><button class="btn" data-r="manual">Just enter my count</button><button class="btn no" data-r="cancel">Cancel</button></div>`;
  else if (run.phase === "count") body = `<div class="rt">${e.name}</div><div class="clock warn">${run.left}</div><p class="cue">Get set. Form first.</p>`;
  else if (run.phase === "go") body = `<div class="rt">${e.name}</div><div class="clock ${run.left <= 10 ? "warn" : ""}">${mm}</div>
    <button class="pad" aria-label="Tap for each rep"><span class="lbl">Tap each rep</span><span class="c">${run.count}</span></button>
    <div class="row2"><button class="btn no" data-r="stop">Stop early</button></div>`;
  else body = `<div class="lbl">Time</div><div class="rt">${e.name}: how many?</div>
    <input id="runval" type="number" inputmode="numeric" min="0" value="${run.count || ""}" placeholder="0" aria-label="Reps completed">
    ${prev ? `<p class="cue">Last test: ${prev}</p>` : ""}
    <div class="row2"><button class="btn go" data-r="save" style="font-size:18px;padding:16px">Save result</button></div>
    <div class="row2"><button class="btn" data-r="redo">Redo</button><button class="btn no" data-r="cancel">Cancel</button></div>`;
  el.innerHTML = body;
  const inp = el.querySelector("#runval"); if (inp) inp.focus();
}
function runnerClick(ev){
  const b = ev.target.closest("[data-r]"); if (!b || !run) return;
  const a = b.dataset.r;
  if (a === "cancel"){ closeRunner(); return; }
  if (a === "manual"){ run.phase = "done"; drawRunner(); return; }
  if (a === "redo"){ clearInterval(run.iv); run.phase = "ready"; run.count = 0; run.left = 60; drawRunner(); return; }
  if (a === "start"){
    run.phase = "count"; run.left = 3; drawRunner(); sfx("beep");
    run.iv = setInterval(() => {
      if (run.phase === "count"){ run.left--; if (run.left > 0){ sfx("beep"); drawRunner(); } else { run.phase = "go"; run.left = 60; sfx("go"); buzz(60); drawRunner(); } return; }
      run.left--;
      const c = document.querySelector("#runner .clock"); if (c){ c.textContent = `${Math.floor(run.left/60)}:${pad(run.left%60)}`; c.classList.toggle("warn", run.left <= 10); }
      if (run.left <= 3 && run.left > 0) sfx("beep");
      if (run.left <= 0){ clearInterval(run.iv); run.phase = "done"; sfx("full"); buzz([80,60,80]); drawRunner(); }
    }, 1000);
    return;
  }
  if (a === "stop"){ clearInterval(run.iv); run.phase = "done"; drawRunner(); return; }
  if (a === "save"){
    const n = parseInt(document.getElementById("runval").value, 10);
    if (isNaN(n) || n <= 0){ toast("Enter how many reps you got."); return; }
    const k = run.k, ex = run.ex, prev = k > 1 ? (tests[me+"|"+(k-1)] || {})[ex] || 0 : 0;
    const b0 = earnedIds(me);
    closeRunner();
    saveTest(k, ex, n).then(() => render());
    render();
    celebrate("mid"); sfx("done");
    const e = EX.find(z => z.id === ex);
    if (prev && n > prev) hype(`+${n - prev}`, `${e.name} · +${(n-prev)*TEST_PTS} pts`);
    else hype(`${n}`, `${e.name} in 1 minute${k === 1 ? " · baseline set" : ""}`);
    announceBadges(b0);
  }
}

  const weekWins = M.weeks.filter(wk => wk.complete && pl.weekPts[wk.w] > M.players[other(p)].weekPts[wk.w]).length;
  const base = pl.tests.find(t => t.k === 1);
  const baseDone = !!base && TEST_EX.every(id => base[id] > 0);
  const lvl = !!base && pl.tests.some(t => t.k > 1 && TEST_EX.every(id => (t[id]||0) > (base[id]||0)));
  return [
    ["tip","Tip-Off","Log your first set","1", ds.some(x => x.base > 0)],
    ["base","Baseline","Finish the first max-out test","T1", baseDone],
    ["full","50 Deep","First full day","50", ds.some(x => x.full)],
    ["s3","Hat Trick","3-day streak","3", pl.best >= 3],
    ["s7","Seven Straight","7-day streak","7", pl.best >= 7],
    ["hot","Hot Streak","First perfect week","HS", maxChain >= 1],
    ["cb","Comeback Kid","Recover a missed day","↺", ds.some(x => x.recovered)],
    ["ww","Weekend Warrior","100+ of one exercise on a bonus day","100", ds.some(x => x.wk && EX.some(e => e.unit === "reps" && x.v[e.id] >= 100))],
    ["win","Week Winner","Win a week","W", weekWins >= 1],
    ["s14","Two Weeks Deep","14-day streak","14", pl.best >= 14],
    ["heat","Heater","2 perfect weeks in a row","HS2", maxChain >= 2],
    ["rope","Quick Feet","60 total minutes of rope","60′", tot.rope >= 60],
    ["lvl","Leveled Up","Beat your baseline on all 3 in a retest","↑", lvl],
    ["pk","1K Push-ups","1,000 career push-ups","1K", tot.push >= 1000],
    ["sk","1K Sit-ups","1,000 career sit-ups","1K", tot.sit >= 1000],
    ["qk","1K Squats","1,000 career squats","1K", tot.squat >= 1000],
    ["w3","Three-Peat","Win 3 weeks","3W", weekWins >= 3],
    ["s30","Iron Will","30-day streak","30", pl.best >= 30]
  ].map(([id,name,desc,code,earned]) => ({ id, name, desc, code, earned: !!earned }));
}
const earnedIds = p => p && M ? new Set(badgeList(p).filter(b => b.earned).map(b => b.id)) : new Set();
const badgeCount = p => badgeList(p).filter(b => b.earned).length;
function announceBadges(before){
  if (!me) return;
  const fresh = badgeList(me).filter(b => b.earned && !before.has(b.id));
  fresh.forEach((b,i) => setTimeout(() => { hype("Badge", `${b.name} unlocked`); celebrate("mid"); sfx("done"); }, 2600 + i*2600));
}
function badgesHtml(){
  const v = bview || me || "keith", list = badgeList(v), n = list.length;
  const cls = v === "keith" ? "storm" : "bomb";
  return `<section class="rules"><h2 class="sech">Badges</h2>
    <div class="bsum who" role="group" aria-label="Whose badges" style="align-self:flex-start">
      <button class="k" data-bview="keith" aria-pressed="${v==="keith"}">Keith ${badgeCount("keith")}/${n}</button>
      <button class="l" data-bview="logan" aria-pressed="${v==="logan"}">Logan ${badgeCount("logan")}/${n}</button></div>
    <div class="bgrid">${list.map((b,i) => `<div class="badge ${b.earned ? (i % 3 === 1 ? cls : "") : "off"}"><div class="medal" aria-hidden="true">${b.code}</div>
      <div class="bn">${b.name}</div><div class="bd">${b.desc}</div></div>`).join("")}</div></section>`;
}

/* ================= ACTIONS ================= */
function change(exId, newVal, opts = {}){
  if (!me || !canWrite) return;
  if (!pinOK){ pinOpen = true; render(); return; }
  const x = M.players[me].days[selDate], e = EX.find(z => z.id === exId);
  const before = M.players[me].days[selDate];
  newVal = Math.max(0, Math.min(Math.round(newVal), x.cap[exId] === Infinity ? 99999 : x.cap[exId]));
  const old = x.v[exId];
  if (newVal === old) return;
  const beforeFull = before.full, beforeGoal = old >= (x.wk ? e.target : e.target + x.need[exId]);
  const prevRecovered = M.players[me].days[addDays(selDate,-1)]?.recovered;
  const b0 = earnedIds(me);
  const v = { ...x.v, [exId]: newVal };
  setVals(me, selDate, v);
  if (opts.pop != null) popAt = { ex: exId, i: opts.pop };
  const goal = x.wk ? e.target : e.target + x.need[exId];
  const up = newVal > old;
  if (up && !beforeGoal && newVal >= goal) slamEx = exId;
  render();
  announceBadges(b0);
  const nx = M.players[me].days[selDate];
  if (!up) { sfx("down"); return; }
  buzz(15);
  const nowRecovered = M.players[me].days[addDays(selDate,-1)]?.recovered;
  if (!beforeFull && nx.full && (!nx.comeback || nowRecovered)) { fullDay(nx); return; }
  if (!prevRecovered && nowRecovered){ celebrate("big"); hype("Comeback", `${DNL[dow(addDays(selDate,-1))]} recovered · streak saved`); sfx("full"); return; }
  if (slamEx || (up && !beforeGoal && newVal >= goal)) { celebrate("mid", opts.el); sfx("done"); buzz([20,40,30]); return; }
  if (x.wk && Math.floor(newVal/50) > Math.floor(old/50)) { celebrate("mid", opts.el); hype(`${newVal}`, `${e.name.toLowerCase()} today · bonus`); sfx("done"); return; }
  celebrate("small", opts.el); sfx("tick");
}
function fullDay(x){
  const pl = M.players[me];
  celebrate("big"); sfx("full"); buzz([30,50,30,50,80]);
  const lines = ["Discipline > motivation", "Nobody's checking. You did it anyway.", "Stronger than yesterday", "That's a bucket", "Money in the bank"];
  hype(x.wk ? "Weekend full" : "Full day", `${pl.streak} day streak · ${lines[Math.floor(Math.random()*lines.length)]}`);
}

app.addEventListener("click", ev => {
  const t = ev.target.closest("button,[data-close],summary");
  if (!t) return;
  if (t.id === "pinOpenBtn"){ pinOpen = true; render(); const i = document.getElementById("pinIn"); i && i.focus(); return; }
  if (t.dataset.tab){ tab = t.dataset.tab; LS.set("fd_tab", tab); openEntry = null; render(); return; }
  if (t.dataset.bview){ bview = t.dataset.bview; render(); return; }
  if (t.dataset.run){ if (!canWrite){ toast("View only."); return; } if (!pinOK){ pinOpen = true; render(); return; } openRunner(t.dataset.run); return; }
  if (t.id === "pinGo"){ const v = (document.getElementById("pinIn").value || "").trim();
    if (v === FAMILY_PIN){ pinOK = true; LS.set("fd_pin", v); pinOpen = false; render(); toast("Unlocked. Go get your reps."); sfx("done"); }
    else { toast("That PIN isn't right. Try again."); sfx("down"); } return; }
  if (t.id === "pinX"){ pinOpen = false; render(); return; }
  if (t.dataset.me){ me = t.dataset.me; LS.set("fd_me", me); openEntry = null; render(); return; }
  if (t.id === "snd"){ sound = !sound; LS.set("fd_sound", sound); render(); if (sound) sfx("tick"); return; }
  if (t.dataset.day){ selDate = t.dataset.day; openEntry = null; render(); return; }
  if (t.dataset.set){
    const e = EX.find(z => z.id === t.dataset.set), i = +t.dataset.i, v = M.players[me].days[selDate].v[e.id];
    const hi = (i+1)*e.per;
    change(e.id, v >= hi ? i*e.per : hi, { pop:i, el:t });
    return;
  }
  if (t.dataset.yes){ const x = M.players[me].days[selDate], e = EX.find(z => z.id === t.dataset.yes); openEntry = null; change(e.id, e.target + x.need[e.id], { el:t }); return; }
  if (t.dataset.entry){ openEntry = openEntry === t.dataset.entry ? null : t.dataset.entry; render(); const inp = document.getElementById("in-"+openEntry); inp && inp.focus(); return; }
  if (t.dataset.save){ const inp = document.getElementById("in-"+t.dataset.save); const n = parseInt(inp.value, 10); openEntry = null; change(t.dataset.save, isNaN(n) ? 0 : n, { el:t }); if (isNaN(n)) render(); return; }
  if (t.dataset.coach && !pinOK){ pinOpen = true; render(); return; }
  if (t.dataset.coach){ sheet = { ex:t.dataset.coach }; render(); return; }
  if (t.dataset.done){ const e = EX.find(z => z.id === t.dataset.done); const v = M.players[me].days[selDate].v[e.id];
    stopTimer(); sheet = null; change(e.id, (Math.floor(v/e.per)+1)*e.per, { pop:Math.floor(v/e.per) }); if (v === M.players[me].days[selDate].v[e.id]) render(); return; }
  if (t.id === "tstart"){ startTimer(t); return; }
  if (t.dataset.close && (ev.target === t || t.tagName === "BUTTON")){ stopTimer(); sheet = null; render(); return; }
});
app.addEventListener("keydown", ev => {
  if (ev.key === "Enter" && ev.target.id === "pinIn"){ document.getElementById("pinGo").click(); return; }
  if (ev.key === "Enter" && ev.target.matches(".entry input")){ const id = ev.target.id.slice(3); document.querySelector(`[data-save="${id}"]`).click(); }
  if (ev.key === "Escape" && sheet){ stopTimer(); sheet = null; render(); }
});

function startTimer(btn){
  stopTimer();
  let left = 60; const clock = document.getElementById("tclock");
  btn.textContent = "Jumping…"; btn.disabled = true; sfx("tick");
  timer = setInterval(() => {
    left--; if (clock) clock.textContent = `0:${pad(left)}`;
    if (left <= 3 && left > 0) sfx("tick");
    if (left <= 0){ stopTimer(); const b = document.querySelector('[data-done="rope"]'); b && b.click(); }
  }, 1000);
}
function stopTimer(){ if (timer){ clearInterval(timer); timer = null; } }

/* ================= FX ================= */
const cv = document.getElementById("fx"), cx = cv.getContext("2d");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
let parts = [], raf = null;
function sizeCv(){ cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; }
addEventListener("resize", sizeCv); sizeCv();
const COLORS = ["#FF7A1A","#FFB23F","#2E7BFF","#8DB6FF","#E3262F","#FFFFFF","#111111"];
function celebrate(size, el){
  if (reduce) return;
  let ox = innerWidth/2, oy = innerHeight*0.45;
  if (el && el.getBoundingClientRect){ const r = el.getBoundingClientRect(); ox = r.left + r.width/2; oy = r.top + r.height/2; }
  const n = size === "big" ? 220 : size === "mid" ? 90 : 22;
  for (let i = 0; i < n; i++){
    const big = size === "big";
    const a = big ? (-Math.PI/2 + (Math.random()-.5)*Math.PI*1.3) : Math.random()*Math.PI*2;
    const sp = (big ? 9 + Math.random()*11 : size === "mid" ? 4 + Math.random()*8 : 2 + Math.random()*4);
    parts.push({ x: big ? innerWidth*(i%2 ? .15 : .85) : ox, y: big ? innerHeight : oy,
      vx: Math.cos(a)*sp + (big ? (i%2 ? 3 : -3) : 0), vy: Math.sin(a)*sp, g: size === "small" ? .12 : .28,
      w: 5 + Math.random()*6, h: 3 + Math.random()*8, rot: Math.random()*6, vr: (Math.random()-.5)*.4,
      c: COLORS[(Math.random()*COLORS.length)|0], life: size === "small" ? 40 : 160, ball: big && Math.random() < .06 });
  }
  if (!raf) raf = requestAnimationFrame(tick);
}
function tick(){
  const d = devicePixelRatio; cx.setTransform(d,0,0,d,0,0); cx.clearRect(0,0,innerWidth,innerHeight);
  parts = parts.filter(p => p.life > 0 && p.y < innerHeight + 40);
  for (const p of parts){
    p.vy += p.g; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life--;
    cx.save(); cx.globalAlpha = Math.min(1, p.life/30); cx.translate(p.x, p.y); cx.rotate(p.rot);
    if (p.ball){ cx.fillStyle = "#FF7A1A"; cx.beginPath(); cx.arc(0,0,9,0,7); cx.fill(); cx.strokeStyle = "#2a1200"; cx.lineWidth = 1.4; cx.beginPath(); cx.moveTo(-9,0); cx.lineTo(9,0); cx.moveTo(0,-9); cx.lineTo(0,9); cx.stroke(); }
    else { cx.fillStyle = p.c; cx.fillRect(-p.w/2, -p.h/2, p.w, p.h); }
    cx.restore();
  }
  raf = parts.length ? requestAnimationFrame(tick) : (cx.clearRect(0,0,innerWidth,innerHeight), null);
}
function hype(big, small){
  const el = document.createElement("div"); el.className = "hype";
  el.innerHTML = `<div class="in"><div class="big">${esc(big)}</div><div class="small">${esc(small)}</div></div>`;
  document.body.appendChild(el); setTimeout(() => el.remove(), 2500);
}
function toast(msg){ const el = document.createElement("div"); el.className = "toast"; el.textContent = msg; document.body.appendChild(el); setTimeout(() => el.remove(), 3200); }
function buzz(p){ try { navigator.vibrate && navigator.vibrate(p); } catch {} }
let ac = null;
function sfx(kind){
  if (!sound) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === "suspended") ac.resume();
    const t0 = ac.currentTime;
    const tone = (f, s, dur, type = "sine", vol = .16) => {
      const o = ac.createOscillator(), g = ac.createGain(); o.type = type; o.frequency.setValueAtTime(f, t0+s);
      g.gain.setValueAtTime(0, t0+s); g.gain.linearRampToValueAtTime(vol, t0+s+.01); g.gain.exponentialRampToValueAtTime(.0001, t0+s+dur);
      o.connect(g).connect(ac.destination); o.start(t0+s); o.stop(t0+s+dur+.02); return o; };
    if (kind === "tick"){ const o = tone(660, 0, .12, "triangle", .18); o.frequency.exponentialRampToValueAtTime(1320, t0+.1); }
    if (kind === "down") tone(330, 0, .12, "triangle", .1);
    if (kind === "tap") tone(990, 0, .06, "square", .06);
    if (kind === "beep") tone(880, 0, .15, "square", .09);
    if (kind === "go") tone(1320, 0, .4, "square", .1);
    if (kind === "done"){ [523,659,784,1047].forEach((f,i) => tone(f, i*.07, .28, "triangle", .15)); }
    if (kind === "full"){ // arena horn + fanfare
      tone(185, 0, .7, "sawtooth", .07); tone(233, 0, .7, "sawtooth", .06);
      [523,659,784,1047,1319].forEach((f,i) => tone(f, .35 + i*.08, .4, "triangle", .14)); }
  } catch {}
}

/* ================= BOOT ================= */
function boot(){
  logs = LS.get("fd_logs", {});
  tests = LS.get("fd_tests", {});
  render();
  if (!window.firebase) { toast("Couldn't reach the scoreboard. Check your connection and refresh."); return; }
  try {
    const fb = firebase.initializeApp(FIREBASE_CONFIG);
    const fs = fb.firestore();
    db = fs; dbCol = fs.collection("logs"); testsCol = fs.collection("tests"); shared = true;
  } catch (e) { toast("Couldn't reach the scoreboard. Refresh to try again."); return; }
  logs = {}; tests = {};
  const idle = () => { const a = document.activeElement; return !(a && a.matches && a.matches(".entry input, #pinIn, #runval")); };
  dbCol.onSnapshot(snap => {
    const next = {};
    snap.docs.forEach(doc => { const b = doc.data(); if (b && b.player && b.date) next[b.player+"|"+b.date] = { push:b.push, sit:b.sit, squat:b.squat, rope:b.rope }; });
    logs = next;
    if (idle() && !sheet) render();
  }, () => toast("Lost the live connection. Refresh the page."));
  testsCol.onSnapshot(snap => {
    const next = {};
    snap.docs.forEach(doc => { const b = doc.data(); if (b && b.player && b.k) next[b.player+"|"+b.k] = { push:b.push||0, sit:b.sit||0, squat:b.squat||0, date:b.date }; });
    tests = next;
    if (idle() && !sheet) render();
  }, () => {});
  render();
}
// re-render at midnight / when returning to the tab so "today" rolls over
let lastToday = todayStr();
document.addEventListener("visibilitychange", () => { if (document.hidden || sheet) return; const t = todayStr(); if (t !== lastToday){ if (selDate === lastToday) selDate = t; lastToday = t; } render(); });
boot();
})();
