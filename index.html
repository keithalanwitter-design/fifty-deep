/* ================= SOUND: team sound sets ================= */
let ac = null, noiseBuf = null;
function audio(){
  ac = ac || new (window.AudioContext || window.webkitAudioContext)();
  if (ac.state === "suspended") ac.resume();
  if (!noiseBuf){ noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random()*2 - 1; }
  return ac;
}
function tone(f, s, dur, type = "sine", vol = .16, f2 = null){
  const t0 = ac.currentTime, o = ac.createOscillator(), g = ac.createGain(); o.type = type; o.frequency.setValueAtTime(f, t0+s);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0+s+dur);
  g.gain.setValueAtTime(0, t0+s); g.gain.linearRampToValueAtTime(vol, t0+s+.012); g.gain.exponentialRampToValueAtTime(.0001, t0+s+dur);
  o.connect(g).connect(ac.destination); o.start(t0+s); o.stop(t0+s+dur+.05); return o;
}
function noise(s, dur, vol = .2, type = "lowpass", f1 = 800, f2 = null, q = .8){
  const t0 = ac.currentTime, src = ac.createBufferSource(), fl = ac.createBiquadFilter(), g = ac.createGain();
  src.buffer = noiseBuf; src.loop = true; fl.type = type; fl.Q.value = q; fl.frequency.setValueAtTime(f1, t0+s); if (f2) fl.frequency.exponentialRampToValueAtTime(f2, t0+s+dur);
  g.gain.setValueAtTime(0, t0+s); g.gain.linearRampToValueAtTime(vol, t0+s+.02); g.gain.exponentialRampToValueAtTime(.0001, t0+s+dur);
  src.connect(fl).connect(g).connect(ac.destination); src.start(t0+s); src.stop(t0+s+dur+.05);
}
function growl(s, dur, f, vol = .12){
  const t0 = ac.currentTime, o = ac.createOscillator(), lfo = ac.createOscillator(), lg = ac.createGain(), fl = ac.createBiquadFilter(), g = ac.createGain();
  o.type = "sawtooth"; o.frequency.setValueAtTime(f, t0+s); o.frequency.exponentialRampToValueAtTime(f*.7, t0+s+dur);
  lfo.frequency.value = 26; lg.gain.value = vol*.8; lfo.connect(lg).connect(g.gain);
  fl.type = "lowpass"; fl.frequency.value = 900;
  g.gain.setValueAtTime(0, t0+s); g.gain.linearRampToValueAtTime(vol, t0+s+.08); g.gain.exponentialRampToValueAtTime(.0001, t0+s+dur);
  o.connect(fl).connect(g).connect(ac.destination); o.start(t0+s); lfo.start(t0+s); o.stop(t0+s+dur+.05); lfo.stop(t0+s+dur+.05);
}
/* Recorded-style sounds (rendered files in /sounds). Anything missing falls back to the synth sounds below.
   To use your own sound, drop an .mp3 with the same file name into the sounds folder. */
const SAMPLES = {
  storm:    { tick:"storm-set",    done:"storm-exercise",    full:"storm-full" },
  cyclones: { tick:"cyclone-set",  done:"cyclone-exercise",  full:"cyclone-full" },
  lancers:  { tick:"lancers-set",  done:"lancers-exercise",  full:"lancers-full" },
  lions:    { tick:"lions-set",    done:"lions-exercise",    full:"lions-full" },
  bombers:  { done:"bombers-plane", full:"bombers-plane" }
};
const sampleSrc = name => (window.FD_SOUNDS && window.FD_SOUNDS[name]) || `sounds/${name}.mp3`;
const bufCache = {};
function loadSample(name){
  if (!bufCache[name]){
    try { audio(); } catch { return Promise.resolve(null); }
    bufCache[name] = fetch(sampleSrc(name)).then(r => r.ok ? r.arrayBuffer() : Promise.reject())
      .then(a => new Promise((res, rej) => ac.decodeAudioData(a, res, rej))).catch(() => null);
  }
  return bufCache[name];
}
function preloadTeam(who){ const fx = pc(who || me || PIDS()[0]).fx; const m = SAMPLES[fx]; if (m && ac) Object.values(m).forEach(loadSample); }
function playSample(name, vol = 1){
  return loadSample(name).then(buf => { if (!buf) return false;
    const src = ac.createBufferSource(), g = ac.createGain(); src.buffer = buf; g.gain.value = vol; src.connect(g).connect(ac.destination); src.start(); return true; });
}

  },

    full(){ [[392,0],[523,.13],[659,.26],[784,.39],[659,.6],[784,.73]].forEach(([f,t]) => tone(f, t, .2, "sawtooth", .08)); tone(1047, .9, .9, "sawtooth", .1); tone(784, .9, .9, "triangle", .06); tone(523, .9, .9, "triangle", .05); noise(.9, .5, .08, "bandpass", 3000, 2000, 2); }
  },

    full(){ [0,.26,.52].forEach(t => tone(1800, t, .5, "sine", .05, 380)); },
    boom(){ noise(0, .9, .5, "lowpass", 260, 60); tone(70, 0, .8, "sine", .4, 35); },
    drop(){ tone(1500, 0, .5, "sine", .05, 420); }
  },
  gamers: {

    done(){ [523,659,784,1047,1319,1568,2093].forEach((f,i) => tone(f, i*.05, .09, "square", .06)); },
    full(){ [[523,.0],[659,.1],[784,.2],[1047,.3],[784,.42],[1047,.52]].forEach(([f,t]) => tone(f, t, .12, "square", .07)); tone(1319, .64, .45, "square", .08); tone(659, .64, .45, "triangle", .06); }
  },
  cyclones: {
    tick(){ noise(0, .3, .18, "bandpass", 500, 2200, 1.6); },
    done(){ noise(0, 1.1, .3, "bandpass", 300, 2600, 1.8); tone(420, 0, 1.1, "sine", .03, 760); },
    full(){ noise(0, 2.0, .35, "bandpass", 250, 3000, 2); noise(.4, 1.6, .2, "lowpass", 900, 200); tone(380, 0, 1.8, "sine", .04, 820); }
  },
  lions: {
    tick(){ growl(0, .22, 120, .09); },
    done(){ growl(0, 1.0, 105, .16); growl(0, 1.0, 158, .07); noise(0, .9, .12, "lowpass", 700, 250); },
    full(){ tone(80, 0, .35, "sine", .35, 45); tone(80, .3, .35, "sine", .35, 45); growl(.45, 1.5, 100, .18); growl(.45, 1.5, 150, .08); noise(.45, 1.3, .16, "lowpass", 800, 200); }
  },
  confetti: {
    tick(){ tone(660, 0, .12, "triangle", .18, 1320); },
    done(){ [523,659,784,1047].forEach((f,i) => tone(f, i*.07, .28, "triangle", .15)); },
    full(){ tone(185, 0, .7, "sawtooth", .07); tone(233, 0, .7, "sawtooth", .06); [523,659,784,1047,1319].forEach((f,i) => tone(f, .35 + i*.08, .4, "triangle", .14)); }
  }
};
function teamSound(kind, who){
  if (!sound) return;
  try {
    audio();
    const fx = who === "_bombers" ? "bombers" : pc(who || me || PIDS()[0]).fx;
    const set = SOUNDS[fx] || SOUNDS.confetti, synth = () => { try { (set[kind] || SOUNDS.confetti[kind] || (() => {}))(); } catch {} };
    const file = SAMPLES[fx] && SAMPLES[fx][kind];
    if (file) playSample(file).then(ok => { if (!ok) synth(); }); else synth();
    if (fx === "bombers" && (kind === "done" || kind === "full")) set.full();   // keep the bomb whistles Logan liked
  } catch {}
}
function sfx(kind, who){
  if (!sound) return;
  try {
    audio();
    if (kind === "down") return void tone(330, 0, .12, "triangle", .1);
    if (kind === "tap") return void tone(990, 0, .06, "square", .06);
    if (kind === "beep") return void tone(880, 0, .15, "square", .09);
    if (kind === "go") return void tone(1320, 0, .4, "square", .1);
    teamSound(kind === "rank" ? "full" : kind, who);
  } catch {}
}

/* ================= SCOREBOARD SUMMARY (read by reminders) ================= */
let boardTimer = null;
function queueBoard(){ clearTimeout(boardTimer); boardTimer = setTimeout(publishBoard, 2500); }
async function publishBoard(){
  if (!shared || !db || !M || M.pre || M.post) return;
  try {
    const st = standings("season"), first = PIDS().filter(p => M.players[p].fullAtToday).sort((a,b) => M.players[a].fullAtToday - M.players[b].fullAtToday)[0];
    const players = {};
    st.forEach((p, i) => { const pl = M.players[p], x = pl.days[M.today], ahead = i > 0 ? st[i-1] : null;
      players[p] = { name: P[p].name, rank: i + 1, pts: pl.seasonPts, streak: pl.streak, onLine: !!pl.onLine, full: !!(x && x.full), rounds: x ? x.rounds : 0,
        ahead: ahead ? P[ahead].name : "", gap: ahead ? M.players[ahead].seasonPts - pl.seasonPts : 0, first: p === first }; });
    await db.collection("status").doc("board").set({ date: M.today, day: dayNum(M.today), updatedAt: Date.now(), players });
  } catch {}
}

/* ================= REMINDERS (web push) ================= */
const pushSupported = () => "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
const pushNeedsInstall = () => isIOS && !isStandalone();
const pushOn = () => { try { return Notification.permission === "granted" && LS.get("fd_push", null) === me; } catch { return false; } };
function b64ToBytes(b){ const s = atob((b + "=".repeat((4 - b.length % 4) % 4)).replace(/-/g, "+").replace(/_/g, "/")); return Uint8Array.from(s, c => c.charCodeAt(0)); }
async function tellWorker(){ try { const c = await caches.open("fd-meta"); await c.put("./__me", new Response(JSON.stringify({ me, name: me && P[me] ? P[me].name : "" }))); } catch {} }
async function enablePush(){
  if (!me) return;
  if (pushNeedsInstall()){ installSheet = true; render(); toast("On iPhone, add 50 Deep to your home screen first, then turn on reminders from the app."); return; }
  try {
    const perm = await Notification.requestPermission();
    if (perm !== "granted"){ render(); const c = document.querySelector(".remind"); c && c.scrollIntoView({ behavior:"smooth", block:"center" }); return; }
    const reg = await navigator.serviceWorker.ready;
    const sub = (await reg.pushManager.getSubscription()) || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(VAPID_PUBLIC) });
    const r = await fetch(PUSH_API + "/subscribe", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ player: me, sub: sub.toJSON() }) });
    if (!r.ok) throw new Error("save failed");
    LS.set("fd_push", me); await tellWorker();
    toast("Reminders are on. Sending you a test now…"); sfx("done"); render();
    setTimeout(testPush, 1500);
  } catch (e){ toast("Couldn't turn on reminders. Check your connection and try again."); }
}
async function disablePush(){
  try { const reg = await navigator.serviceWorker.ready, sub = await reg.pushManager.getSubscription();
    if (sub){ fetch(PUSH_API + "/unsubscribe", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ endpoint: sub.endpoint }) }).catch(() => {}); await sub.unsubscribe(); } } catch {}
  LS.set("fd_push", null); toast("Reminders are off."); render();
}
async function testPush(){ try { const r = await fetch(`${PUSH_API}/test?pin=${FAMILY_PIN}&player=${encodeURIComponent(me)}`); const j = await r.json(); toast(j.sent && j.sent.length ? "Test sent. It should pop up in a few seconds." : "No reminder sign-up found on this phone yet."); } catch { toast("Couldn't send a test right now."); } }
// keep the reminder sign-up pointed at whoever this phone logs as
async function syncPushPlayer(){
  try { if (!pushSupported() || Notification.permission !== "granted" || !me) return; const saved = LS.get("fd_push", null); if (!saved || saved === me) { tellWorker(); return; }
    const reg = await navigator.serviceWorker.ready, sub = await reg.pushManager.getSubscription(); if (!sub) return;
    await fetch(PUSH_API + "/subscribe", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ player: me, sub: sub.toJSON() }) });
    LS.set("fd_push", me); tellWorker();
  } catch {}
}
const pushPerm = () => { try { return Notification.permission; } catch { return "default"; } };
function reminderCard(){
  if (!me || M.post) return "";
  const help = `<ul class="rhelp">${isIOS ? `<li><b>iPhone:</b> open the phone's <b>Settings</b> → <b>Notifications</b> → <b>50 Deep</b> → turn on <b>Allow Notifications</b>. Then come back and tap Try again.</li>`
    : isAndroid ? `<li><b>Android:</b> tap the <b>lock</b> (or ⋮ → <b>Site settings</b>) next to the web address → <b>Notifications</b> → <b>Allow</b>. Then tap Try again.</li>`
    : `<li>This browser is blocking notifications. Reminders are meant for your phone: open 50 Deep there, tap your name, and allow them.</li>`}</ul>`;
  if (!pushSupported()) return isIOS ? `<section class="remind"><div><b>Daily reminders</b><span>On iPhone, reminders work once 50 Deep is on your home screen. Add it, open it from the icon, and turn them on here.</span></div>
    <div class="rbtns"><button class="btn go" id="instLink">Add to home screen</button></div></section>` : "";
  if (pushOn()) return `<section class="remind on"><div><b>Reminders on ✓</b><span>7:00 AM game plan · 5:30 PM check-in · 8:45 PM last call if you're not done.</span></div>
    <div class="rbtns"><button class="btn go" id="pushTest">Send a test</button><button class="btn no" id="pushOff">Turn off</button></div></section>`;
  if (pushPerm() === "denied" && LS.get("fd_push_hide", false)) return "";
  if (pushPerm() === "denied") return `<section class="remind blocked"><div><b>Reminders are blocked</b><span>Your ${isIOS || isAndroid ? "phone" : "browser"} said no to notifications for 50 Deep. Here's how to fix it:</span>${help}</div>
    <div class="rbtns"><button class="btn go" id="pushOn">Try again</button><button class="btn no" id="pushHide">Hide</button></div></section>`;
  if (LS.get("fd_push_hide", false)) return "";
  return `<section class="remind"><div><b>Daily reminders</b><span>A game plan at 7:00 AM, a check-in at 5:30 PM, and a last call at 8:45 PM if you're not done. Personal to your spot on the board.</span></div>
    <div class="rbtns"><button class="btn go" id="pushOn">${pushNeedsInstall() ? "Add to home screen first" : "Turn on reminders"}</button><button class="btn no" id="pushHide">Not now</button></div></section>`;
}

    <span class="emb" style="color:${T.hex};display:flex;justify-content:center">${emblem(T.icon, 60)}</span>

    <p class="readonly" style="font-size:16px;color:#C9D1E3">A game plan at 7:00 AM, a check-in at 5:30 PM, and a last call at 8:45 PM if you haven't finished. Written for your spot on the leaderboard.</p>
    <button class="btn go" id="askYes" style="justify-content:center;font-size:18px;padding:14px">${pushNeedsInstall() ? "Show me how (iPhone)" : "Yes, allow notifications"}</button>

}
let remindAsk = false;
/* ================= INSTALL (home screen app) ================= */
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferredInstall = e; render(); });
addEventListener("appinstalled", () => { deferredInstall = null; toast("50 Deep is on your home screen."); celebrate("mid"); render(); });

/* ================= BOOT ================= */
window.fiftyDeep = { celebrate: (s, w) => celebrate(s, null, w), hype: (b, sm, w) => hype(b, sm, w), sound: (k, w) => sfx(k, w) };
function boot(){
  applyPlayers(LS.get("fd_players", {}));
  logs = LS.get("fd_logs", {});
  tests = LS.get("fd_tests", {});
  checkins = LS.get("fd_checkins", {});
  const savedPw = wallPw || (String(LS.get("fd_pin", "")).toLowerCase() === FAMILY_PASSWORD ? FAMILY_PASSWORD : "");
  if (savedPw) unlockWall(savedPw).then(ok => { if (ok && tab === "wall") render(); });
  render();
  if (!window.firebase) { toast("Couldn't reach the scoreboard. Check your connection and refresh."); return; }
  try {
    const fb = firebase.initializeApp(FIREBASE_CONFIG);
    const fs = fb.firestore();
    db = fs; dbCol = fs.collection("logs"); testsCol = fs.collection("tests"); playersCol = fs.collection("players"); shared = true;
  } catch (e) { toast("Couldn't reach the scoreboard. Refresh to try again."); return; }
  logs = {}; tests = {};
  const idle = () => { const a = document.activeElement; return !(a && a.matches && a.matches(".entry input, #pinIn, #runval, #npName, #npTeam, #wallPw, .cibox textarea")) && !ciSheet; };
  dbCol.onSnapshot(snap => {
    const next = {};
    snap.docs.forEach(doc => { const b = doc.data(); if (b && b.player && b.date) next[b.player+"|"+b.date] = { push:b.push, sit:b.sit, squat:b.squat, rope:b.rope, gainAt:b.gainAt || 0, fullAt:b.fullAt || 0 }; });
    const had = M && booted ? { r: me ? rankOf(me) : null, full: new Set(PIDS().filter(p => M.players[p] && M.players[p].days[M.today] && M.players[p].days[M.today].full)) } : null;
    logs = next;
    if (idle() && !sheet){ render(); if (had) liveNews(had); }
    if (!booted) setTimeout(() => { publishBoard(); syncPushPlayer(); }, 3000);
    booted = true;
  }, () => toast("Lost the live connection. Refresh the page."));
  checkinsCol = fs.collection("checkins");
  checkinsCol.onSnapshot(snap => {
    const next = {};
    snap.docs.forEach(doc => { const b = doc.data(); if (b && b.player && b.week && b.week <= WEEKS_IN_SEASON && b.ct) next[b.player+"|"+b.week] = { iv:b.iv, ct:b.ct, createdAt:b.createdAt || 0, updatedAt:b.updatedAt || 0, week:b.week }; });
    checkins = next;
    if (idle()) render();
  }, () => {});
  playersCol.onSnapshot(snap => {
    const docs = {}; snap.docs.forEach(doc => docs[doc.id] = doc.data());
    applyPlayers(docs);
    if (idle() && !sheet && !adding) render();
  }, () => {});
  testsCol.onSnapshot(snap => {
    const next = {};
    snap.docs.forEach(doc => { const b = doc.data(); if (b && b.player && b.k) next[b.player+"|"+b.k] = { push:b.push||0, sit:b.sit||0, squat:b.squat||0, date:b.date }; });
    tests = next;
    if (idle() && !sheet) render();
  }, () => {});
  render();
}
// re-render at midnight / when returning to the tab so "today" rolls over
let lastToday = todayStr();
document.addEventListener("visibilitychange", () => { if (document.hidden || sheet) return; const t = todayStr(); if (t !== lastToday){ if (selDate === lastToday) selDate = t; lastToday = t; } render(); });
boot();
})();
