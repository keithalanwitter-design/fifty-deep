<style>
:root{
  --ground:#0A0F1C; --panel:#111A2C; --panel2:#17223A; --line:#24314D;
  --ink:#F3F5FA; --mute:#8D9AB5; --dim:#5A6784;
  --storm:#2E7BFF; --storm-deep:#1649B8; --orange:#FF7A1A; --orange-soft:#FF9E57;
  --bomb:#E3262F; --bomb-deep:#8E1118; --white:#FFFFFF; --good:#34D27B;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --label:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--ground)}
body{color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:14px 60px;display:flex;flex-direction:column;gap:18px}
.lbl{font-family:var(--label);text-transform:uppercase;letter-spacing:.09em;font-weight:600;font-size:13px;color:var(--mute)}
.num{font-family:var(--display);font-variant-numeric:tabular-nums;font-weight:900;line-height:.9}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand .mark{width:58px;height:58px;flex:none;filter:drop-shadow(0 4px 10px rgba(0,0,0,.4))}
.brand small{display:block;margin-top:4px}
.brand h1{margin:0;font-family:var(--display);font-weight:900;font-size:44px;letter-spacing:.01em;line-height:.85;text-transform:uppercase}
.brand h1 b{color:var(--orange)}
.brand small{font-family:var(--label);text-transform:uppercase;letter-spacing:.14em;font-size:12px;color:var(--mute);font-weight:600}
.who{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.who button{padding:7px 14px;border-radius:999px;font-family:var(--label);text-transform:uppercase;letter-spacing:.08em;font-weight:700;font-size:14px;color:var(--mute)}
.who button[aria-pressed="true"].k{background:var(--storm);color:#fff}
.who button[aria-pressed="true"].l{background:var(--bomb);color:#fff}
.iconbtn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;color:var(--mute)}
.iconbtn svg{width:18px;height:18px}

/* scoreboard */
.board{position:relative;border-radius:18px;overflow:hidden;background:
  radial-gradient(120% 60% at 0% 0%,rgba(46,123,255,.20),transparent 55%),
  radial-gradient(120% 60% at 100% 0%,rgba(227,38,47,.18),transparent 55%),
  var(--panel);border:1px solid var(--line)}
.board::before{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border:2px solid rgba(255,255,255,.05);border-radius:50%;pointer-events:none}
.board-head{position:relative;display:flex;justify-content:center;padding-top:12px}
.weektag{font-family:var(--label);font-weight:700;text-transform:uppercase;letter-spacing:.14em;font-size:13px;background:var(--orange);color:#1a0d00;padding:4px 12px;border-radius:4px}
.sides{position:relative;display:grid;grid-template-columns:1fr auto 1fr;align-items:start;padding:10px 14px 16px;gap:6px}
.side{display:flex;flex-direction:column;gap:6px;min-width:0}
.side.r{align-items:flex-end;text-align:right}
.pname{font-family:var(--display);font-weight:900;font-size:30px;text-transform:uppercase;line-height:1;letter-spacing:.02em}
.side.l .pname{color:#8DB6FF}.side.r .pname{color:#FF8A8F}
.team{font-family:var(--label);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);font-weight:600}
.score{font-size:clamp(54px,15vw,84px);color:var(--white);text-shadow:0 0 24px rgba(255,122,26,.25)}
.score.lead{color:var(--orange-soft)}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.side.r .chips{justify-content:flex-end}
.chip{font-family:var(--label);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:12px;padding:3px 8px;border-radius:4px;background:var(--panel2);border:1px solid var(--line);color:var(--ink);white-space:nowrap}
.chip.heat{background:linear-gradient(90deg,#FF5A00,#FFB23F);border-color:transparent;color:#1a0800}
.chip.streak{border-color:rgba(255,122,26,.5);color:var(--orange-soft)}
.chip.dog{background:var(--good);color:#032012;border-color:transparent}
.vs{align-self:center;display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:6px}
.vs .v{font-family:var(--display);font-weight:900;font-size:22px;color:var(--dim)}
.vs .rec{font-family:var(--label);font-size:12px;letter-spacing:.08em;color:var(--mute);text-align:center;line-height:1.2}
.h2h{position:relative;border-top:1px solid var(--line);padding:12px 14px 14px;display:grid;gap:8px}
.h2h .row{display:grid;grid-template-columns:1fr 92px 1fr;align-items:center;gap:8px}
.bar{height:10px;background:rgba(255,255,255,.06);border-radius:5px;overflow:hidden;display:flex}
.bar.l{justify-content:flex-end}
.bar i{display:block;height:100%;border-radius:5px;transition:width .5s cubic-bezier(.2,.9,.3,1.2)}
.bar.l i{background:linear-gradient(270deg,var(--storm),#6FA3FF)}
.bar.r i{background:linear-gradient(90deg,var(--bomb),#FF6A70)}
.h2h .mid{text-align:center;font-family:var(--label);font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);font-weight:600;line-height:1.1}
.h2h .mid b{display:block;color:var(--ink);font-size:13px}
.h2h-cap{display:flex;justify-content:space-between}

/* coach line */
.coach{display:flex;gap:14px;align-items:center}
.coach .ball{flex:none;width:52px;height:52px}
.coach p{margin:0;font-size:18px;line-height:1.3;font-weight:500;text-wrap:pretty}
.coach p b{font-weight:700;color:var(--orange-soft)}
.coach .sub{display:block;font-size:14px;color:var(--mute);font-weight:500;margin-top:3px}

/* week strip */
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dbtn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px 7px;border-radius:10px;background:var(--panel);border:1px solid var(--line);position:relative;min-width:0}
.dbtn .dn{font-family:var(--label);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:12px;color:var(--mute)}
.dbtn .dd{font-family:var(--display);font-weight:800;font-size:22px;line-height:1}
.dbtn .dots{display:flex;flex-wrap:wrap;justify-content:center;gap:3px;max-width:36px}
.dot{width:7px;height:7px;border-radius:50%;background:transparent;border:1.5px solid var(--dim)}
.dot.k.part{border-color:var(--storm)}.dot.k.full{background:var(--storm);border-color:var(--storm)}
.dot.l.part{border-color:var(--bomb)}.dot.l.full{background:var(--bomb);border-color:var(--bomb)}
.dbtn.wknd{background:linear-gradient(180deg,rgba(255,122,26,.13),var(--panel))}
.dbtn .x15{position:absolute;top:-7px;font-family:var(--label);font-size:10px;font-weight:700;background:var(--orange);color:#1a0d00;padding:0 4px;border-radius:3px;letter-spacing:.04em}
.dbtn[aria-current="date"]{border-color:var(--orange);box-shadow:0 0 0 1px var(--orange) inset}
.dbtn.sel{background:var(--ink);color:var(--ground)}
.dbtn.sel .dn{color:var(--ground)}
.dbtn:disabled{opacity:.35;cursor:default}

/* banners */
.banner{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-size:15px}
.banner b{font-family:var(--label);text-transform:uppercase;letter-spacing:.07em;font-size:14px;display:block}
.banner.cb{border-color:rgba(52,210,123,.5);background:linear-gradient(90deg,rgba(52,210,123,.14),var(--panel2))}
.banner.cb b{color:var(--good)}
.banner.wk{border-color:rgba(255,122,26,.5);background:linear-gradient(90deg,rgba(255,122,26,.16),var(--panel2))}
.banner.wk b{color:var(--orange-soft)}
.banner .tag{flex:none;font-family:var(--display);font-weight:900;font-size:26px;line-height:1}

/* day header */
.dayhead{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
.dayhead h2{margin:0;font-family:var(--display);font-weight:900;font-size:32px;text-transform:uppercase;line-height:.95}
.dayhead h2 span{color:var(--mute);font-weight:700}
.rounds{display:flex;align-items:center;gap:8px}
.rounds .pips{display:flex;gap:4px}
.rounds .pips i{width:18px;height:6px;border-radius:3px;background:var(--line)}
.rounds .pips i.on{background:var(--orange)}
.daypts{font-family:var(--display);font-weight:900;font-size:30px;color:var(--orange-soft);line-height:1}

/* exercise cards */
.cards{display:grid;gap:12px}
.card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:12px;overflow:hidden}
.card.done{border-color:rgba(255,122,26,.65);background:radial-gradient(120% 120% at 100% 0%,rgba(255,122,26,.16),transparent 60%),var(--panel)}
.chead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.chead h3{margin:0;font-family:var(--display);font-weight:900;font-size:28px;text-transform:uppercase;line-height:.95;letter-spacing:.01em}
.chead .musc{font-size:13px;color:var(--mute);margin-top:4px}
.count{text-align:right;flex:none}
.count .n{font-family:var(--display);font-weight:900;font-size:40px;line-height:.9;font-variant-numeric:tabular-nums}
.count .n small{font-size:20px;color:var(--mute);font-weight:800}
.count .p{font-family:var(--label);font-size:13px;color:var(--orange-soft);font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.sets{display:flex;flex-wrap:wrap;gap:8px}
.set{position:relative;width:52px;height:52px;border-radius:50%;border:2px dashed var(--dim);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:17px;color:var(--mute);transition:transform .12s;overflow:hidden;isolation:isolate}
.set:active{transform:scale(.9)}
.set .fill{position:absolute;inset:0;background:conic-gradient(var(--orange) var(--pct,0%),transparent 0);z-index:-1;border-radius:50%}
.set.on{border:2px solid var(--orange);background:radial-gradient(circle at 35% 30%,#FFB36B,var(--orange) 55%,#C85200);color:#261000;box-shadow:0 4px 16px rgba(255,122,26,.35)}
.set.on::after{content:"";position:absolute;inset:0;background:
  linear-gradient(transparent 48%,rgba(0,0,0,.28) 48%,rgba(0,0,0,.28) 52%,transparent 52%),
  radial-gradient(circle at 50% -40%,transparent 62%,rgba(0,0,0,.26) 63%,rgba(0,0,0,.26) 66%,transparent 67%),
  radial-gradient(circle at 50% 140%,transparent 62%,rgba(0,0,0,.26) 63%,rgba(0,0,0,.26) 66%,transparent 67%);border-radius:50%;pointer-events:none}
.set .sl{position:relative;z-index:2}
.set.on .sl{background:rgba(255,190,130,.9);padding:0 3px;border-radius:4px;line-height:1.1}
.set.extra.on .sl{background:rgba(160,240,190,.9)}
.set.part{border-style:solid;border-color:var(--orange)}
.set.extra{border-color:var(--good)}
.set.extra.on{background:radial-gradient(circle at 35% 30%,#8BF0B6,var(--good) 55%,#16874A);border-color:var(--good);color:#032012}
.set.pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{font-family:var(--label);font-weight:700;text-transform:uppercase;letter-spacing:.07em;font-size:14px;padding:10px 14px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);display:inline-flex;align-items:center;gap:6px}
.btn.go{background:var(--me,var(--storm));border-color:var(--me,var(--storm));color:#fff}
.btn.yes{border-color:rgba(255,122,26,.6);color:var(--orange-soft)}
.btn.no{color:var(--mute)}
.btn:disabled{opacity:.4;cursor:default}
.entry{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--panel2);border-radius:10px;padding:10px}
.entry label{font-size:14px;color:var(--mute);flex:1 1 150px}
.entry input{width:90px;font:inherit;font-family:var(--display);font-weight:800;font-size:24px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--ground);color:var(--ink)}
.stamp{position:absolute;right:14px;bottom:10px;font-family:var(--display);font-weight:900;font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:var(--orange);border:2px solid var(--orange);padding:2px 8px;border-radius:4px;transform:rotate(-6deg);opacity:.9;pointer-events:none}
.stamp.slam{animation:slam .55s cubic-bezier(.2,1.4,.4,1)}
@keyframes slam{0%{transform:rotate(-6deg) scale(3);opacity:0}100%{transform:rotate(-6deg) scale(1);opacity:.9}}
.readonly{font-size:14px;color:var(--mute)}

/* leaderboard */
.lbhead{position:relative;display:flex;justify-content:space-between;align-items:center;padding:12px 14px 4px;gap:10px}
.lb{position:relative;list-style:none;margin:0;padding:4px 8px 8px;display:grid;gap:6px}
.lbrow{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:10px 10px 10px 6px;border-radius:12px;background:rgba(255,255,255,.025);border:1px solid transparent;border-left:4px solid var(--pc)}
.lbrow.me{background:rgba(255,255,255,.06);border-color:var(--line);border-left-color:var(--pc)}
.lbrow .rk{font-family:var(--display);font-weight:900;font-size:26px;text-align:center;color:var(--mute);line-height:1}
.lbrow.lead .rk{color:#1a0d00;background:var(--orange);border-radius:50%;width:32px;height:32px;display:grid;place-items:center;font-size:20px}
.lbmain{display:grid;gap:6px;min-width:0}
.nm{font-family:var(--display);font-weight:900;font-size:24px;text-transform:uppercase;line-height:1;color:var(--pcs);display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.nm small{font-family:var(--label);font-size:12px;letter-spacing:.12em;color:var(--mute);font-weight:600}
.nm small.you{color:#1a0d00;background:var(--pcs);padding:0 5px;border-radius:3px;letter-spacing:.08em}
.mini{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;max-width:240px}
.mini i{height:6px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden;display:block}
.mini b{display:block;height:100%;background:var(--pc);border-radius:3px;transition:width .5s}
.lbrow .chips{gap:4px}
.lbrow .chip{font-size:11px;padding:2px 6px}
.lbpts{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.lbpts .num{font-size:clamp(34px,9vw,46px);color:var(--white)}
.lbrow.lead .lbpts .num{color:var(--orange-soft)}
.lbpts small{font-family:var(--label);font-size:12px;color:var(--mute);letter-spacing:.06em;text-transform:uppercase;font-weight:600;white-space:nowrap}
.lbfoot{position:relative;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:6px 14px 12px;border-top:1px solid var(--line)}
.lbfoot .linkbtn{margin:0;color:var(--orange-soft)}
.asbtn{display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-family:var(--label);font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:14px}
.asbtn i{width:10px;height:10px;border-radius:50%}
.pick .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.pbtn{padding:20px 8px;border-radius:16px;font-family:var(--display);font-weight:900;font-size:26px;text-transform:uppercase;color:#fff;line-height:1}
.pbtn small{display:block;font-family:var(--label);font-size:12px;letter-spacing:.12em;font-weight:600;opacity:.85;margin-top:4px}
.pbtn.add{background:transparent;border:2px dashed var(--dim);color:var(--ink);font-size:20px}
.fl{font-family:var(--label);text-transform:uppercase;letter-spacing:.08em;font-size:13px;color:var(--mute);font-weight:600;margin-bottom:-6px}
.fi{font:inherit;font-size:18px;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);width:100%}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:40px;height:40px;border-radius:50%;border:3px solid transparent;color:#fff;font-weight:900;font-size:22px;line-height:1}
.sw[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--ground) inset}
.bchip{padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-family:var(--label);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:13px;color:var(--mute)}
.bchip[aria-pressed="true"]{background:var(--pc);border-color:var(--pc);color:#fff}
.badge.pc .medal{background:radial-gradient(circle at 35% 30%,var(--pcs),var(--pc) 55%,var(--pcd));color:#fff;box-shadow:0 0 0 3px var(--panel),0 0 0 5px var(--pc)}
.pdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle}
/* season bar, champion, pre-season */
.season{display:grid;gap:8px;padding:12px 14px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}
.sb-top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.sb-top .num{font-size:40px;color:var(--orange-soft)}
.track{position:relative;height:8px;border-radius:4px;background:rgba(255,255,255,.07);overflow:visible}
.track i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--storm),var(--orange))}
.track .tick{position:absolute;top:-3px;width:3px;height:14px;border-radius:2px;background:var(--dim);transform:translateX(-50%)}
.track .tick.on{background:var(--ink)}
.cue{margin:0;font-size:16px;font-weight:600;color:#DDE3F0;text-wrap:pretty}
.season.pre .num{font-size:56px}
.champ{display:flex;gap:14px;align-items:center;padding:16px;border-radius:16px;background:radial-gradient(120% 140% at 0% 0%,var(--pc),var(--pcd));color:#fff}
.champ h2{margin:0;font-family:var(--display);font-weight:900;font-size:44px;text-transform:uppercase;line-height:.9}
.champ p{margin:4px 0 0;font-weight:600}
.champ .lbl{color:rgba(255,255,255,.85)}
.precard{display:grid;gap:12px;padding:18px;border-radius:16px;background:radial-gradient(120% 90% at 100% 0%,color-mix(in srgb,var(--pc) 30%,transparent),transparent 60%),var(--panel);border:1px solid var(--line)}
.precard h2{margin:0;font-family:var(--display);font-weight:900;font-size:34px;text-transform:uppercase;line-height:.95}
.precard p{margin:0;color:#C9D1E3;max-width:62ch}
.prestep{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 12px;border-radius:12px;background:var(--panel2)}
.prestep b{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--pc);color:#fff;font-family:var(--display);font-size:18px}
.prestep.ok b{background:var(--good);color:#032012}
.prestep span{flex:1 1 180px}
.coach .emb.big{flex:none;width:52px;height:52px;display:grid;place-items:center;border-radius:50%;background:var(--panel);border:1px solid var(--line)}
.nm .emb{display:inline-flex;align-self:center}
.lbpts small.gap{color:var(--dim);text-transform:none;letter-spacing:0;font-family:var(--body);font-size:12px}
.lbrow.fullday{box-shadow:0 0 0 1px color-mix(in srgb,var(--pc) 50%,transparent) inset}
.lbrow{border-left-color:var(--pc);background-image:linear-gradient(90deg,color-mix(in srgb,var(--pc) 12%,transparent),transparent 40%)}
.chip.done{background:var(--pc);border-color:transparent;color:#fff}
.seg{display:flex;background:var(--ground);border:1px solid var(--line);border-radius:999px;padding:2px}
.seg button{padding:9px 12px;min-height:34px;border-radius:999px;font-family:var(--label);font-weight:700;text-transform:uppercase;letter-spacing:.07em;font-size:12px;color:var(--mute)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--ground)}
/* install banner */
.install{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:45;width:min(calc(100% - 24px),520px);display:flex;gap:12px;align-items:center;padding:12px 12px 12px 14px;border-radius:16px;background:var(--panel2);border:1px solid var(--orange);box-shadow:0 12px 40px rgba(0,0,0,.5)}
.install.anim{animation:up .3s}
.install img{width:44px;height:44px;border-radius:10px;flex:none}
.install .it{flex:1;min-width:0}
.install .it b{display:block;font-family:var(--display);font-weight:900;font-size:18px;text-transform:uppercase;line-height:1}
.install .it span{font-size:13px;color:var(--mute)}
.install .x{flex:none;width:30px;height:30px;border-radius:50%;color:var(--mute);font-size:18px}
.iosteps{display:grid;gap:10px;margin:0;padding:0;list-style:none;text-align:left}
.iosteps li{display:flex;gap:12px;align-items:center;padding:12px;border-radius:12px;background:var(--panel2);font-size:16px}
.iosteps li b{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--orange);color:#1a0d00;font-family:var(--display)}
.iosteps svg{vertical-align:middle}
/* reminders card */
.remind{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:14px;border-radius:14px;background:linear-gradient(90deg,color-mix(in srgb,var(--me,#FF7A1A) 18%,transparent),var(--panel));border:1px solid var(--line)}
.remind > div:first-child{flex:1 1 240px}
.remind b{display:block;font-family:var(--display);font-weight:900;font-size:22px;text-transform:uppercase;line-height:1;margin-bottom:4px}
.remind span{font-size:14px;color:#C9D1E3}
.rbtns{display:flex;gap:8px;flex-wrap:wrap}
.lbmore{display:block;width:calc(100% - 16px);margin:0 8px 8px;padding:10px;border-radius:10px;border:1px dashed var(--line);font-family:var(--label);font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:13px;color:var(--mute)}
.lbmore:hover{color:var(--ink);border-color:var(--mute)}
.remind.on{background:linear-gradient(90deg,rgba(52,210,123,.16),var(--panel));border-color:rgba(52,210,123,.45)}
.remind.on b{color:var(--good)}
.remind.blocked{border-color:rgba(227,38,47,.5);background:linear-gradient(90deg,rgba(227,38,47,.14),var(--panel))}
.rhelp b{display:inline;font-family:var(--body);font-size:inherit;font-weight:700;text-transform:none;letter-spacing:0;margin:0;line-height:inherit;color:#fff}
.rhelp{margin:8px 0 0;padding-left:18px;font-size:14px;color:#DDE3F0;display:grid;gap:6px}
/* check-ins + wall */
.cicard{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:14px;border-radius:14px;background:linear-gradient(90deg,rgba(255,122,26,.18),var(--panel));border:1px solid rgba(255,122,26,.5)}
.cicard > div:first-child{flex:1 1 240px}
.cicard b{display:block;font-family:var(--display);font-weight:900;font-size:22px;text-transform:uppercase;line-height:1;margin-bottom:4px;color:var(--orange-soft)}
.cicard span{font-size:14px;color:#C9D1E3}
.cibox{text-align:left;max-height:92vh;overflow:auto;padding:4px 2px 10px}
.pick:has(.cibox){background:#05080F;align-items:start;overflow:auto}
.cibox h2{text-align:left;font-size:32px}
.ciphoto{display:grid;place-items:center;min-height:150px;border:2px dashed var(--line);border-radius:14px;background:var(--panel);cursor:pointer;text-align:center;overflow:hidden}
.ciphoto span{font-family:var(--display);font-weight:900;font-size:24px;text-transform:uppercase}
.ciphoto small{display:block;color:var(--mute);font-size:13px}
.ciphoto img{width:100%;max-height:320px;object-fit:cover;display:block}
.moods{display:flex;flex-wrap:wrap;gap:6px}
.mood{padding:9px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-family:var(--label);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:13px;color:var(--mute);min-height:36px}
.mood[aria-pressed="true"]{background:var(--me,var(--orange));border-color:var(--me,var(--orange));color:#fff}
.cibox textarea.fi{font-size:16px;resize:vertical}
.wallweek{display:grid;gap:12px}
.wallweek h3{margin:6px 0 0;font-family:var(--display);font-weight:900;font-size:26px;text-transform:uppercase}
.post{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--pc);border-radius:14px;padding:14px;display:grid;gap:10px}
.post .ph{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.post .ph b{font-family:var(--display);font-weight:900;font-size:22px;text-transform:uppercase;color:var(--pcs)}
.post .ph small{margin-left:auto;color:var(--mute);font-size:12px}
.post .pimg{width:100%;max-height:420px;object-fit:cover;border-radius:10px}
.post p{margin:0;font-size:15px;color:#DDE3F0;white-space:pre-wrap}
.post .q{display:block;font-family:var(--label);text-transform:uppercase;letter-spacing:.08em;font-size:12px;color:var(--mute);font-weight:700;margin-bottom:2px}
.moodchip{background:var(--pc);border-color:transparent;color:#fff}
/* tabs */
.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.tabs button{position:relative;padding:7px 2px 6px;min-width:0;border-radius:9px;font-family:var(--label);font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-size:11px;color:var(--mute);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;line-height:1}
.tabs .tl{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs .tdot{position:absolute;top:5px;right:calc(50% - 16px);width:9px;height:9px;border-radius:50%;background:var(--good);box-shadow:0 0 0 2px var(--panel)}
.tabs .tnum{position:absolute;top:3px;right:calc(50% - 22px);font-style:normal;font-size:10px;min-width:16px;line-height:16px;padding:0 4px;border-radius:999px;background:var(--orange);color:#1a0d00;text-align:center;box-shadow:0 0 0 2px var(--panel)}
.tabs button[aria-selected="true"] .tdot,.tabs button[aria-selected="true"] .tnum{box-shadow:0 0 0 2px var(--ink)}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--ground)}
.tc{font-size:11px;background:var(--orange);color:#1a0d00;border-radius:999px;padding:0 6px;line-height:16px}
.tc.due{background:var(--good);color:#032012}
.sech{margin:0;font-family:var(--display);font-weight:900;font-size:32px;text-transform:uppercase;line-height:.95}
.intro{margin:0;color:#C9D1E3;font-size:15px;max-width:62ch}
.linkbtn{font-family:var(--label);font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--good);padding:8px 2px;min-height:34px;margin-top:0;display:inline-block}
.banner.test{border-color:rgba(52,210,123,.5);background:linear-gradient(90deg,rgba(52,210,123,.14),var(--panel2))}
.banner.test b{color:var(--good)}
.banner.test .tag{font-size:20px;color:var(--good)}
/* tests */
.tcard{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:12px}
.tcard.open{border-color:rgba(52,210,123,.55)}
.thead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.thead h3{margin:0;font-family:var(--display);font-weight:900;font-size:26px;text-transform:uppercase;line-height:1}
.trow{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.trow .tn{font-family:var(--display);font-weight:800;font-size:22px;text-transform:uppercase}
.trow .tv{font-family:var(--display);font-weight:900;font-size:34px;font-variant-numeric:tabular-nums;min-width:48px;text-align:right}
.trow .tv.none{color:var(--dim)}
.cmp{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.cmp th{font-family:var(--label);text-transform:uppercase;letter-spacing:.08em;font-size:12px;color:var(--mute);font-weight:600;text-align:right;padding:4px 6px}
.cmp th:first-child,.cmp td:first-child{text-align:left}
.cmp td{padding:8px 6px;border-top:1px solid var(--line);text-align:right;font-size:15px}
.cmp td b{font-family:var(--display);font-weight:900;font-size:24px}
.cmp .k b{color:#8DB6FF}.cmp .l b{color:#FF8A8F}
.up{display:block;font-size:12px;color:var(--good);font-weight:700}
.up.dn{color:var(--bomb)}
.locked{color:var(--dim);font-size:14px}
/* runner */
.runner{position:fixed;inset:0;z-index:48;background:radial-gradient(90% 60% at 50% 30%,rgba(255,122,26,.18),transparent 70%),var(--ground);display:flex;flex-direction:column;align-items:center;padding:calc(18px + env(safe-area-inset-top,0px)) 16px calc(18px + env(safe-area-inset-bottom,0px));gap:12px;overflow:auto}
.runner .rt{font-family:var(--display);font-weight:900;font-size:30px;text-transform:uppercase;text-align:center;line-height:1}
.runner .clock{font-family:var(--display);font-weight:900;font-size:clamp(90px,30vw,150px);line-height:.9;font-variant-numeric:tabular-nums}
.runner .clock.warn{color:var(--orange)}
.runner .pad{width:min(100%,420px);flex:1;min-height:200px;max-height:340px;border-radius:24px;border:3px solid var(--orange);background:rgba(255,122,26,.08);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.runner .pad:active{background:rgba(255,122,26,.2)}
.runner .pad .c{font-family:var(--display);font-weight:900;font-size:96px;line-height:.9;font-variant-numeric:tabular-nums}
.runner .row2{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:min(100%,420px)}
.runner .row2 .btn{flex:1;justify-content:center}
.runner input{width:120px;font-family:var(--display);font-weight:900;font-size:44px;text-align:center;padding:6px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.runner .cue{max-width:420px;text-align:center;color:#C9D1E3;font-size:15px;margin:0}
/* badges */
.bsum{display:flex;gap:10px;flex-wrap:wrap}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.badge{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:12px 6px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}
.medal{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:24px;color:#1f0d00;
  background:radial-gradient(circle at 35% 30%,#FFD9A8,#FF8A2A 55%,#B84A00);box-shadow:0 0 0 3px var(--panel),0 0 0 5px var(--orange),0 6px 18px rgba(255,122,26,.35)}
.badge.storm .medal{background:radial-gradient(circle at 35% 30%,#BFD6FF,#2E7BFF 55%,#123A8F);color:#fff;box-shadow:0 0 0 3px var(--panel),0 0 0 5px var(--storm),0 6px 18px rgba(46,123,255,.35)}
.badge.bomb .medal{background:radial-gradient(circle at 35% 30%,#FFC2C4,#E3262F 55%,#6E0B10);color:#fff;box-shadow:0 0 0 3px var(--panel),0 0 0 5px var(--bomb),0 6px 18px rgba(227,38,47,.35)}
.badge .bn{font-family:var(--label);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:14px;line-height:1.1}
.badge .bd{font-size:12px;color:var(--mute);line-height:1.25}
.badge.off .medal{background:var(--panel2);color:var(--dim);box-shadow:0 0 0 3px var(--panel),0 0 0 5px var(--line)}
.badge.off .bn{color:var(--mute)}
.badge .who2{display:flex;gap:4px}
/* rules */
.rules{display:grid;gap:14px}
details.rules summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;font-family:var(--display);font-weight:900;font-size:24px;text-transform:uppercase}
details.rules summary::-webkit-details-marker{display:none}
details.rules summary span{font-family:var(--label);font-size:13px;color:var(--mute);letter-spacing:.08em}
.rulebody{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:14px}
.rule h4{margin:0 0 3px;font-family:var(--label);font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:15px;color:var(--orange-soft)}
.rule p{margin:0;color:#C9D1E3;font-size:15px;max-width:62ch}
.ladder{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.foot{text-align:center;color:var(--dim);font-size:14px;font-style:italic;padding-top:4px}
.save{font-size:12px;color:var(--dim);text-align:center}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(3,6,14,.72);backdrop-filter:blur(3px);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px));display:grid;gap:14px;animation:up .28s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h3{margin:0;font-family:var(--display);font-weight:900;font-size:34px;text-transform:uppercase;line-height:.95}
.sheet .why{background:var(--panel2);border-radius:10px;padding:10px 12px;font-size:15px;color:#C9D1E3}
.sheet .why b{color:var(--orange-soft)}
.sheet ol,.sheet ul{margin:0;padding-left:22px;display:grid;gap:7px;font-size:16px}
.sheet ul.miss li::marker{color:var(--bomb)}
.sheet .big{font-family:var(--display);font-weight:900;font-size:24px;text-transform:uppercase;letter-spacing:.03em;padding:16px;border-radius:14px;background:linear-gradient(180deg,#FF923F,var(--orange));color:#211000;width:100%}
.timer{display:flex;align-items:center;gap:16px;justify-content:center}
.timer .t{font-family:var(--display);font-weight:900;font-size:64px;font-variant-numeric:tabular-nums;line-height:1}
.pick{position:fixed;inset:0;z-index:50;background:rgba(5,8,16,.92);display:grid;place-items:center;padding:16px}
.pick .box{max-width:420px;width:100%;display:grid;gap:14px;text-align:center}
.pick h2{margin:0;font-family:var(--display);font-weight:900;font-size:40px;text-transform:uppercase;line-height:.95}
.pick .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick .two button{padding:22px 10px;border-radius:16px;font-family:var(--display);font-weight:900;font-size:30px;text-transform:uppercase;color:#fff}
.pick .two .k{background:linear-gradient(160deg,var(--storm),var(--storm-deep))}
.pick .two .l{background:linear-gradient(160deg,var(--bomb),var(--bomb-deep))}
.pick .two small{display:block;font-family:var(--label);font-size:13px;letter-spacing:.12em;font-weight:600;opacity:.85}

/* celebration */
#fx{position:fixed;inset:0;pointer-events:none;z-index:60}
.hype{position:fixed;inset:0;z-index:55;display:grid;place-items:center;pointer-events:none}
.hype .in{text-align:center;animation:hype 2.4s cubic-bezier(.2,1.2,.3,1) forwards;padding:16px}
.hype .big{font-family:var(--display);font-weight:900;font-size:clamp(64px,20vw,130px);line-height:.85;text-transform:uppercase;color:#fff;
  text-shadow:0 0 0 #000,4px 4px 0 var(--h1,var(--orange)),8px 8px 0 var(--h2,var(--storm-deep)),0 0 40px var(--h1,rgba(255,122,26,.6))}
.hype .emb{display:flex;justify-content:center;color:var(--h1);margin-bottom:6px;filter:drop-shadow(0 0 14px var(--h1))}
.hype .small{color:var(--h3,var(--orange-soft))!important}
.hype.fx-lancers .small,.hype.fx-lions .small{color:#fff!important}
.hype.fx-gamers .big{font-family:"Courier New",monospace;letter-spacing:-.02em;text-shadow:4px 4px 0 var(--h2),0 0 30px var(--h1)}
.hype.fx-gamers .in{animation-timing-function:steps(8)}
.hype.fx-cyclones .in{animation-name:hypespin}
@keyframes hypespin{0%{transform:scale(.2) rotate(-540deg);opacity:0}25%{transform:scale(1.05) rotate(8deg);opacity:1}35%{transform:scale(1) rotate(0)}80%{opacity:1}100%{opacity:0}}
.hype.fx-bombers .in{animation-name:hypeboom}
@keyframes hypeboom{0%{transform:scale(3);opacity:0}12%{transform:scale(.9);opacity:1}20%{transform:scale(1.05)}28%{transform:scale(1)}80%{opacity:1}100%{opacity:0}}
.flash{position:fixed;inset:0;z-index:57;pointer-events:none;animation:flash linear forwards}
@keyframes flash{0%{opacity:1}100%{opacity:0}}
body.shake .wrap{animation:shake .42s}
@keyframes shake{0%,100%{transform:translate(0)}20%{transform:translate(-6px,3px)}40%{transform:translate(5px,-4px)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-2px)}}
.hype .small{font-family:var(--label);font-weight:700;text-transform:uppercase;letter-spacing:.16em;font-size:18px;color:var(--orange-soft);margin-top:10px}
@keyframes hype{0%{transform:scale(.3) rotate(-8deg);opacity:0}15%{transform:scale(1.08) rotate(2deg);opacity:1}25%{transform:scale(1) rotate(0)}80%{opacity:1}100%{opacity:0;transform:scale(1.05)}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--ground);font-weight:600;padding:10px 16px;border-radius:999px;z-index:58;font-size:15px;animation:up .25s;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:reduce){.bar i,.mini b,.set{transition:none!important}}
@media (max-width:420px){.pname{font-size:24px}.set{width:46px;height:46px}.chead h3{font-size:24px}.h2h .row{grid-template-columns:1fr 78px 1fr}}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
.pin{display:flex;gap:8px;justify-content:center}
.pin input{width:150px;text-align:center;letter-spacing:.4em;font-family:var(--display);font-weight:900;font-size:40px;padding:8px;border-radius:12px;border:1px solid var(--line);background:var(--ground);color:var(--ink)}

function vals(p, d){
  const k = p+"|"+d, v = local[k] || logs[k] || {};
  return { push:+v.push||0, sit:+v.sit||0, squat:+v.squat||0, rope:+v.rope||0 };
}
function meta(p, d){ const k = p+"|"+d, v = local[k] || logs[k] || {}; return { gainAt: +v.gainAt || 0, fullAt: +v.fullAt || 0 }; }
function setVals(p, d, v){
  const k = p+"|"+d;
  local[k] = v;
  if (!shared){ const all = LS.get("fd_logs", {}); all[k] = v; LS.set("fd_logs", all); return; }
  clearTimeout(pending[k]);
  pending[k] = setTimeout(() => flush(p, d), 650);
}
async function flush(p, d){
  const k = p+"|"+d;
  if (writing[k]) { pending[k] = setTimeout(() => flush(p, d), 300); return; }
  const v = local[k]; if (!v) return;
  writing[k] = true;
  try {
    await dbCol.doc(p+"_"+d).set({ player:p, date:d, ...v, updatedAt:Date.now() });
    logs[k] = v;
    queueBoard();
    if (local[k] === v) delete local[k];
  } catch (e) {
    if (e && (e.code === "invalid_argument" || e.code === "permission-denied")) { toast("That entry was rejected by the scoreboard. Refresh and try again."); }
    else if (e && e.code === "unavailable") { setTimeout(() => flush(p, d), 1500); }
    else toast("Couldn't save just now. Your reps are kept on screen, try again in a sec.");
  } finally { writing[k] = false; }
}

/* ================= GAME ENGINE ================= */
const full = v => EX.every(e => v[e.id] >= e.target);
function compute(){
  const today = todayStr();
  const last = today < SEASON_START ? SEASON_START : (today > SEASON_END ? SEASON_END : today);
  const dates = []; for (let d = SEASON_START; d <= last; d = addDays(d,1)) dates.push(d);
  const M = { today, dates, players:{}, weeks:[] };
  const nWeeks = weekIdx(last) + 1;
  M.pre = today < SEASON_START; M.post = today > SEASON_END;

  for (const p of PIDS()){
    const days = {}, joined = (P[p] && P[p].joined) || SEASON_START;
    for (const d of dates){
      const v = vals(p, d), wk = isWknd(d), prev = addDays(d,-1);
      const need = { push:0, sit:0, squat:0, rope:0 };
      if (prev >= SEASON_START && prev >= joined && !isWknd(prev)){
        const pv = vals(p, prev);
        if (!full(pv)) EX.forEach(e => need[e.id] = Math.max(0, e.target - pv[e.id]));
      }
      const cap = {}; EX.forEach(e => cap[e.id] = wk ? Infinity : e.target + need[e.id]);
      days[d] = { d, v, wk, need, cap, full: full(v), comeback: EXID.some(id => need[id] > 0), pts: 0, mult: wk ? 1.5 : 1, wkMult: wk ? 1.5 : 1 };
    }
    for (const d of dates){
      const x = days[d], nx = days[addDays(d,1)];
      x.recovered = !x.wk && !x.full && !!nx && EX.every(e => nx.v[e.id] >= e.target + nx.need[e.id]);
      x.pre = d < joined;                 // before this player joined: never counts against them
      x.ok = x.full || x.recovered || x.pre;
      x.base = EX.reduce((s,e) => s + Math.min(x.v[e.id], x.cap[e.id]) * e.pts, 0);
      x.sets = EX.map(e => Math.floor(Math.min(x.v[e.id], e.target) / e.per));
      x.rounds = Math.min(...x.sets);
    }
    // streak
    let s = 0, best = 0, onLine = false;
    const yest = addDays(today,-1);
    for (const d of dates){
      const x = days[d];
      if (x.pre) {}
      else if (x.wk){ if (x.full) s++; }
      else if (x.ok) s++;
      else if (d === today) {}
      else if (d === yest && today >= SEASON_START) { onLine = true; }
      else s = 0;
      best = Math.max(best, s);
    }
    M.players[p] = { days, streak:s, best, onLine, chain:[], bonus:[], testBonus:[], weekPts:[], weekdayPts:[], perfect:[], okCount:[] };
  }

  // tests: improvement bonus lands in the week the retest is logged
  for (const p of PIDS()){
    const pl = M.players[p]; pl.tests = testList(p);
    pl.tests.forEach((t,i) => { t.gain = 0; if (i > 0){ const pr = pl.tests[i-1];
      t.gain = TEST_EX.reduce((s,id) => s + Math.max(0, (t[id]||0) - (pr[id]||0)), 0) * TEST_PTS; } });
  }
  // weeks: hot streak bonus, points, underdog weekends
  for (let w = 0; w < nWeeks; w++){
    const wd = []; for (let i = 0; i < 7; i++) wd.push(addDays(weekStart(w), i));
    const inWeek = wd.filter(d => inSeason(d) && d <= last && d <= today);
    for (const p of PIDS()){
      const pl = M.players[p];
      const weekdays = wd.slice(0,5).filter(inSeason);           // tip-off week and final week are short
      pl.needCount = pl.needCount || []; pl.needCount[w] = weekdays.length;
      pl.okCount[w] = weekdays.filter(d => pl.days[d] && pl.days[d].ok).length;
      pl.perfect[w] = weekdays.length > 0 && pl.okCount[w] === weekdays.length;
      pl.chain[w] = pl.perfect[w] ? (w ? pl.chain[w-1] : 0) + 1 : 0;
      pl.bonus[w] = pl.perfect[w] ? HOT_BONUS[Math.min(pl.chain[w], 3) - 1] : 0;
      pl.weekdayPts[w] = weekdays.filter(d => pl.days[d]).reduce((s,d) => s + pl.days[d].base, 0);
    }
    // underdogs: anyone below the middle of the pack on weekday points gets 2x on the weekend
    const ids = PIDS(), vals0 = ids.map(p => M.players[p].weekdayPts[w]).sort((a,b) => a-b);
    const mid = vals0.length ? (vals0[Math.floor((vals0.length-1)/2)] + vals0[Math.ceil((vals0.length-1)/2)]) / 2 : 0;
    const dogs = new Set(ids.length > 1 ? ids.filter(p => M.players[p].weekdayPts[w] < mid) : []);
    for (const p of PIDS()){
      const pl = M.players[p]; let tot = 0;
      for (const d of inWeek){
        const x = pl.days[d];
        const wm = x.wk ? (dogs.has(p) ? 2 : 1.5) : 1;
        x.mult = wm; x.wkMult = wm;
        x.pts = Math.round(x.base * x.mult);
        tot += x.pts;
      }
      pl.testBonus[w] = pl.tests.filter(t => t.date && weekIdx(t.date > SEASON_END ? SEASON_END : t.date) === w).reduce((s,t) => s + t.gain, 0);
      pl.weekPts[w] = tot + pl.bonus[w] + pl.testBonus[w];
    }
    M.weeks.push({ w, dates:wd, dogs, complete: addDays(weekStart(w),6) < today || (M.post && w === nWeeks-1) });
  }
  // season record from completed weeks
  // season record: weekly wins (a tie at the top counts as a win for each)
  const rec = {}; PIDS().forEach(p => rec[p] = 0);
  M.weeks.filter(x => x.complete).forEach(x => {
    const top = Math.max(...PIDS().map(p => M.players[p].weekPts[x.w]));
    if (top > 0) PIDS().forEach(p => { if (M.players[p].weekPts[x.w] === top) rec[p]++; });
    x.winners = PIDS().filter(p => top > 0 && M.players[p].weekPts[x.w] === top);
  });
  M.rec = rec;
  PIDS().forEach(p => { const pl = M.players[p];
    pl.lastGain = Math.max(0, ...M.dates.map(d => meta(p, d).gainAt));
    pl.fullAtToday = meta(p, today).fullAt || 0;
    pl.weekGain = w => Math.max(0, ...M.weeks[w].dates.filter(d => d <= today).map(d => meta(p, d).gainAt));
    pl.seasonPts = pl.weekPts.reduce((a,b) => a + b, 0);
    pl.fullDays = Object.values(pl.days).filter(x => !x.pre && x.full && x.d <= today).length; });
  return M;
}

      return `<i class="dot" style="${st}"></i>`; };
    return `<button class="dbtn ${isWknd(d) ? "wknd" : ""} ${d===selDate ? "sel" : ""}" data-day="${d}" ${d===today ? 'aria-current="date"' : ""} ${disabled ? "disabled" : ""} aria-label="${DNL[dow(d)]} ${d}">

  // ---- my day
  let dayHtml = "";
  if (me && M.pre){
    const c = pc(me), t1 = tests[me+"|1"] || {}, done1 = TEST_EX.every(id => t1[id] > 0);
    dayHtml = `<section class="precard" style="--pc:${c.hex};--pcd:${c.deep}">
      <span class="emb" style="color:${c.hex}">${emblem(c.icon, 56)}</span>
      <div class="lbl">${esc(P[me].team || "")} · Pre-season</div>
      <h2>Tip-off ${fmtDate(SEASON_START)}</h2>
      <p>Starting Wednesday, every day is 50 push-ups, 50 sit-ups, 50 squats and 5 minutes of rope, in sets of 10. Weekends are uncapped and score 1.5x. The season runs 30 days and ends ${fmtDate(SEASON_END)}.</p>
      <div class="prestep ${done1 ? "ok" : ""}"><b>${done1 ? "✓" : "1"}</b><span>${done1 ? "Baseline test done. That's your number to beat on Day 30." : "Do your baseline max-out test: 2 minutes each of push-ups, sit-ups and squats."}</span>${done1 ? "" : `<button class="btn go" data-tab="tests">Start test →</button>`}</div>

  } else if (me){

      const miss = EX.filter(e => x.need[e.id] > 0).map(e => `${x.need[e.id]} ${e.unit==="min" ? "min of rope" : e.name.toLowerCase()}`).join(", ");
      const prevName = DNL[dow(addDays(selDate,-1))];

        ${entryOpen ? `<div class="entry"><label for="in-${e.id}">${x.wk ? `How many ${e.unit==="min" ? "minutes" : "reps"} total today?` : `How many ${e.unit==="min" ? "minutes" : e.name.toLowerCase()} did you get?`}</label>

        ${done ? `<span class="stamp ${slamEx === e.id ? "slam" : ""}">${e.unit==="min" ? "Rope done" : x.wk && v > e.target ? v + " deep" : "50 deep"}</span>` : ""}

    dayHtml = `

      <div class="dayhead">
        <div><div class="lbl">${esc(P[me].name)}'s log · ${x.wk ? "Bonus day" : "Weekday"}</div>
        <h2>${isToday ? "Today" : DNL[dow(selDate)]} <span>${parse(selDate).toLocaleDateString(undefined,{month:"short",day:"numeric"})}</span></h2></div>
        <div style="text-align:right"><div class="lbl">Day points</div><div class="daypts num">${fmt(x.pts)}</div></div>
      </div>
      <div class="rounds"><span class="lbl">Rounds</span><span class="pips">${Array.from({length:ROUNDS},(_,i)=>`<i class="${i < x.rounds ? "on" : ""}"></i>`).join("")}</span>

      <div class="cards">${cards}</div>`;

  app.innerHTML = `<div class="wrap">
    <header class="top">
      <div class="brand"><img class="mark" src="${LOGO_MARK}" alt="50 Deep logo" width="58" height="58"><div><h1>50 <b>Deep</b></h1><small>The Witters · 30-Day Challenge</small></div></div>
      <div style="display:flex;gap:8px;align-items:center">
        <button class="asbtn" id="whoBtn" aria-label="Change who's logging">${me ? `<i style="background:${pc(me).hex}"></i><span>${esc(P[me].name)}</span>` : "<span>Pick player</span>"}<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg></button>
        <button class="iconbtn" id="snd" aria-label="Sound ${sound ? "on" : "off"}" title="Sound">${sound
          ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/></svg>`
          : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M17 9l5 6M22 9l-5 6"/></svg>`}</button>
      </div>
    </header>

    ${champ ? `<section class="champ" style="--pc:${pc(champ).hex};--pcd:${pc(champ).deep}"><span class="emb">${emblem(pc(champ).icon, 44)}</span><div><div class="lbl">50 Deep champion</div><h2>${esc(P[champ].name)}</h2><p>${fmt(M.players[champ].seasonPts)} points · ${M.players[champ].fullDays} full days · ${esc(P[champ].team || "")}</p></div></section>` : ""}
    <section class="board" aria-label="Leaderboard">
      <div class="lbhead"><span class="weektag">${M.pre ? "Pre-season" : M.post ? "Final standings" : `Day ${dayNum(today)} of ${SEASON_DAYS}`}</span>
        <div class="seg" role="group" aria-label="Leaderboard view"><button data-lb="season" aria-pressed="${lbMode !== "week"}">Season</button><button data-lb="week" aria-pressed="${lbMode === "week"}">Week ${w+1}</button></div></div>
      <ol class="lb">${lbRows}</ol>
      ${order.length > 4 ? `<button class="lbmore" id="lbMore" aria-expanded="${!compact}">${compact ? `Show all ${order.length} players ▾` : "Show top 3 ▴"}</button>` : ""}
      <div class="lbfoot"><span class="lbl">Bars: ${EX.map(e => e.short).join(" · ")} (${selDate === today ? "today" : DNL[dow(selDate)]})</span>
        ${ids.length < MAX_PLAYERS ? `<button class="linkbtn" id="addBtn">+ Add player</button>` : ""}</div>
    </section>

    ${seasonBar()}
    ${me ? coachLine() : ""}

    <nav class="tabs" role="tablist" aria-label="Sections">
      ${[["today","Today","M4 7h16M4 12h16M4 17h10"],["tests","Max-Out","M12 3v3M5 9a7 7 0 1 0 14 0M12 13l3-3"],["wall","Wall","M4 5h16v14H4zM4 15l5-5 4 4 3-3 4 4"],["badges","Badges","M12 3l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.4 6.8 19.1l1-5.8L3.5 9.2l5.9-.9z"],["rules","Rules","M6 3h9l4 4v14H6zM9 11h7M9 15h7M9 7h3"]].map(([id,l,ic]) => { const nb = id === "badges" ? badgeCount(me||PIDS()[0]) : 0;
        const due = (id === "tests" && testDue()) || (id === "wall" && me && ciOpenWeek() != null && !ciPosted(me, ciOpenWeek()));
        return `<button role="tab" data-tab="${id}" aria-selected="${tab===id}" aria-label="${l}${due ? " (action needed)" : ""}"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${ic}"/></svg><span class="tl">${l}</span>${due ? `<i class="tdot"></i>` : nb ? `<i class="tnum">${nb}</i>` : ""}</button>`; }).join("")}
    </nav>

    ${tab === "today" ? `${me && testDue() && !M.pre ? `<div class="banner test"><span class="tag">2:00</span><div><b>${testDue() === 1 ? "Baseline test first" : `Test ${testDue()} is open`}</b>${testDue() === 1 ? "Before the grind starts, find out where you stand: 2 minutes each of max push-ups, sit-ups and squats." : "30 days of work. Time to see how much stronger you got."} <button class="linkbtn" data-tab="tests">Go to Max-Out →</button></div></div>` : ""}
    ${checkinCard()}
    ${reminderCard()}
    <nav class="strip" aria-label="Days this week">${strip}</nav>
    ${dayHtml}` : ""}
    ${tab === "tests" ? testsHtml() : ""}
    ${tab === "wall" ? wallHtml() : ""}
    ${tab === "badges" ? badgesHtml() : ""}
    ${tab === "rules" ? `    <section class="rules">
      <h2 class="sech">Game rules</h2>
      <div class="rulebody">
        <div class="rule"><h4>The season</h4><p>30 days, from ${fmtDate(SEASON_START)} to ${fmtDate(SEASON_END)}. Everyone's points add up across the whole season, and the most points on Day 30 wins it all. The leaderboard's Week view shows who is winning the current week.</p></div>
        <div class="rule"><h4>Your team</h4><p>Every player reps a team: Storm, Lancers, Bombers, Gamers, Cyclones and Lions. Finish a set, finish an exercise, finish a full day, or climb the leaderboard, and your team's colors and sounds take over the screen.</p></div>
        <div class="rule"><h4>The daily 50</h4><p>Monday through Friday: 50 push-ups, 50 sit-ups, 50 squats and 5 minutes of jump rope. Sets of 10, five rounds spread through the day. Once you go past 10 your form breaks, so don't. Each rep is 1 point and each minute of rope is 10, so a full weekday is worth 200 points before multipliers. Weekday reps are capped at 50 each.</p></div>
        <div class="rule"><h4>Bonus weekends</h4><p>Saturday and Sunday have no cap. Every rep scores 1.5x, so 10 push-ups is 15 points. This is where weeks get won.</p></div>
        <div class="rule"><h4>Streak</h4><p>Hit all four goals on a weekday and your streak grows. Weekends are bonus: a full weekend day adds to the streak, a skipped one never breaks it.</p></div>
        <div class="rule"><h4>Hot streak bonus</h4><p>Go a perfect week (every weekday that week full, make-ups count) and you bank a flat bonus on that week's score. Stack perfect weeks back to back and the bonus grows. Miss one and it starts over at +100. It's a flat bonus, not a multiplier, so one rough week never leaves anybody out of reach.</p>
          <div class="ladder">${HOT_BONUS.map((h,i) => `<span class="chip heat">${["1st","2nd","3rd+"][i]} week +${h}</span>`).join("")}</div></div>
        <div class="rule"><h4>Max-out tests</h4><p>Two tests: a baseline before tip-off and a final on Day 30. Two minutes each of max push-ups, sit-ups and squats. Pace yourself: you can rest, and only good-form reps count. The final pays ${TEST_PTS} points for every rep you beat your baseline by. This is where you see the work paying off.</p></div>
        <div class="rule"><h4>Comeback day</h4><p>Came up short on a weekday? The next day you get make-up sets (the green bubbles). Finish them on top of your normal 50 and the missed day counts as full again: streak saved, perfect week still alive, and the reps score.</p></div>
        <div class="rule"><h4>Underdog weekend</h4><p>Anyone in the bottom half of the leaderboard on weekday points going into the weekend scores 2x on Saturday and Sunday instead of 1.5x. Nobody gets smoked for long.</p></div>
        <div class="rule"><h4>Tiebreaker: first one done</h4><p>Tied on points? Whoever finished their full day first today ranks higher, then whoever reached that score first. Knock your sets out early and you jump everyone still waiting until tonight.</p></div>
        <div class="rule"><h4>Family Wall check-ins</h4><p>Every Sunday (and on Day 30), post a photo, how you feel, and a few words about your week. It shows up on the Wall for the whole family, Arkansas and Illinois. The Wall opens with the same family password you use to log reps, and posts are scrambled so nobody outside the family can read them.</p></div>
        <div class="rule"><h4>Winning</h4><p>Most points Monday through Sunday wins the week (a tie at the top is a win for everyone tied). Weekly wins build the season record. Anyone can join mid-season from "+ Add player" and start stacking points that day. Honor system all the way. The real win is showing up every day.</p></div>
      </div>
    </section>` : ""}
    <p class="foot">Discipline is doing it when nobody's checking. Stronger, faster, quicker by tip-off.</p>
    ${canOfferInstall() ? `<p class="save"><button class="linkbtn" id="instLink">Install on this phone</button></p>` : ""}
    ${me && pushSupported() && !pushOn() && pushPerm() !== "denied" && LS.get("fd_push_hide", false) ? `<p class="save"><button class="linkbtn" id="pushUnhide">Turn on daily reminders</button></p>` : ""}
    <p class="save">${shared ? "Scores sync live for the whole family." : "Connecting to the scoreboard…"}${pinOK ? "" : ` · <button class="linkbtn" id="pinOpenBtn" style="color:var(--mute)">Enter family password</button>`}</p>
  </div>
  ${!me || picking || adding ? pickHtml() : ""}
  ${sheet ? sheetHtml() : ""}
  ${me && !picking && !adding && !pinOpen && !installSheet && !remindAsk && canOfferInstall() && !installSnoozed() ? `<div class="install ${installAnimated ? "" : "anim"}" role="region" aria-label="Install 50 Deep">
    <img src="icon-192.png" alt=""><div class="it"><b>Add to home screen</b><span>One tap to log reps, like an app.</span></div>
    <button class="btn go" id="instGo">Install</button><button class="x" id="instX" aria-label="Not now">✕</button></div>` : ""}
  ${installSheet ? installSheetHtml() : ""}

  ${pinOpen ? `<div class="pick" role="dialog" aria-modal="true" aria-label="Family password"><div class="box">
    <div class="lbl">50 Deep</div><h2>Family password</h2>
    <p class="readonly">Enter it once on this phone to log reps and open the Family Wall. Capitals don't matter. Anyone can watch the scoreboard.</p>
    <div class="pin"><input id="pinIn" type="password" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" aria-label="Family password" placeholder="Password" style="width:100%;letter-spacing:.06em;font-size:24px"></div>
    <button class="btn go" id="pinGo" style="justify-content:center;font-size:18px;padding:14px">Unlock</button>
    <button class="btn no" id="pinX" style="justify-content:center">Just watching</button></div></div>` : ""}`;
  popAt = null; slamEx = null;
  if (tab === "wall" && wallKey) wallHtmlAsync();
  if (document.querySelector(".install")) installAnimated = true;
}

function coachLine(){
  const pl = M.players[me], name = P[me].name, today = M.today;
  const st = standings("season"), r = st.indexOf(me) + 1, ahead = r > 1 ? st[r - 2] : null;
  const gap = ahead ? M.players[ahead].seasonPts - pl.seasonPts : 0;
  const second = st.filter(q => q !== me)[0];
  const lead = second ? pl.seasonPts - M.players[second].seasonPts : 0;
  const race = pl.seasonPts === 0 && (!ahead || M.players[ahead].seasonPts === 0) ? "Everybody's at zero. First one to finish today takes #1." : ahead ? (gap > 0 ? `You're #${r}, ${fmt(gap)} back of ${P[ahead].name}. ${Math.ceil(gap / 10)} set${Math.ceil(gap/10) === 1 ? "" : "s"} closes it.` : `You're tied with ${P[ahead].name}, but they got there first. Finish your day first and you jump them.`)
                     : pl.seasonPts > 0 ? (lead > 0 ? `You're #1 by ${fmt(lead)}. Don't give them air.` : `You're tied for #1. Break the tie.`) : "";
  const hr = new Date().getHours();
  const greet = hr < 12 ? `Hey ${name}, ready to take on the day?` : hr < 17 ? `Afternoon, ${name}. Let's keep it moving.` : `Evening, ${name}. Still time to finish strong.`;
  let main, sub;
  if (M.pre){
    const n = daysBetween(today, SEASON_START);
    main = `${name}, tip-off is <b>${n === 1 ? "tomorrow" : "in " + n + " days"}</b>.`;
    sub = testDue() === 1 ? `Get your baseline max-out test in before Wednesday. That's the number you'll beat on Day 30.` : `Baseline is locked in. Rest up. Wednesday it's 50 of everything.`;
  } else if (M.post){
    main = `<b>30 days. You showed up.</b>`;
    sub = `Finished #${r} with ${fmt(pl.seasonPts)} points and ${pl.fullDays} full days. ${testDue() ? "Log your Day 30 final test on the Max-Out tab." : "That discipline goes with you into the season."}`;
  } else {
    const x = pl.days[today];
    if (!x.wk){
      const next = EX.map(e => ({ e, left: (e.target + x.need[e.id]) - x.v[e.id] })).filter(o => o.left > 0).sort((a,b) => b.left - a.left)[0];
      if (!next){ main = `<b>Full day banked.</b> ${pl.streak}-day streak.`; sub = race || "Now go live your day."; }
      else if (x.base === 0){ main = greet; sub = `Round 1 of 5: 10 push-ups, 10 sit-ups, 10 squats, 1 minute of rope. ${race}`; }
      else { main = `${name}, you're <b>${x.rounds} of 5 rounds</b> in.`;
        sub = `Next: ${next.e.unit === "min" ? `jump rope, ${next.left} min left` : `${next.e.name.toLowerCase()}, ${next.left} to go`}. ${race}`; }
    } else {
      main = x.base === 0 ? `${greet} <b>No cap today.</b>` : `<b>${fmt(x.pts)} bonus points</b> so far.`;
      sub = `Weekend reps are worth ${x.wkMult}x. This is where you make a move. ${race}`;
    }
    if (pl.onLine) sub = `Streak on the line: finish yesterday's make-up sets today to save it.`;
  }

function drawRunner(){
  const el = document.getElementById("runner"); if (!el || !run) return;
  const e = EX.find(z => z.id === run.ex), mm = `${Math.floor(run.left/60)}:${pad(run.left%60)}`;

  let body = "";

  else if (run.phase === "count") body = `<div class="rt">${e.name}</div><div class="clock warn">${run.left}</div><p class="cue">Get set. Form first.</p>`;
  else if (run.phase === "go") body = `<div class="rt">${e.name}</div><div class="clock ${run.left <= 10 ? "warn" : ""}">${mm}</div>

    <button class="pad" aria-label="Tap for each rep"><span class="lbl">Tap each rep</span><span class="c">${run.count}</span></button>
    <div class="row2"><button class="btn no" data-r="stop">Stop early</button></div>`;
  else body = `<div class="lbl">Time</div><div class="rt">${e.name}: how many?</div>
    <input id="runval" type="number" inputmode="numeric" min="0" value="${run.count || ""}" placeholder="0" aria-label="Reps completed">
    ${prev ? `<p class="cue">Last test: ${prev}</p>` : ""}
    <div class="row2"><button class="btn go" data-r="save" style="font-size:18px;padding:16px">Save result</button></div>
    <div class="row2"><button class="btn" data-r="redo">Redo</button><button class="btn no" data-r="cancel">Cancel</button></div>`;

}
function runnerClick(ev){
  const b = ev.target.closest("[data-r]"); if (!b || !run) return;
  const a = b.dataset.r;
  if (a === "cancel"){ closeRunner(); return; }
  if (a === "manual"){ run.phase = "done"; drawRunner(); return; }
  if (a === "redo"){ clearInterval(run.iv); run.phase = "ready"; run.count = 0; run.left = TEST_SECS; drawRunner(); return; }
  if (a === "start"){
    run.phase = "count"; run.left = 3; drawRunner(); sfx("beep");
    run.iv = setInterval(() => {
      if (run.phase === "count"){ run.left--; if (run.left > 0){ sfx("beep"); drawRunner(); } else { run.phase = "go"; run.left = TEST_SECS; sfx("go"); buzz(60); drawRunner(); } return; }
      run.left--;
      const c = document.querySelector("#runner .clock"); if (c){ c.textContent = `${Math.floor(run.left/60)}:${pad(run.left%60)}`; c.classList.toggle("warn", run.left <= 10); }
      if (run.left === 60 || run.left === 20){ drawRunner(); sfx("beep"); }
      if (run.left <= 3 && run.left > 0) sfx("beep");
      if (run.left <= 0){ clearInterval(run.iv); run.phase = "done"; sfx("full"); buzz([80,60,80]); drawRunner(); }
    }, 1000);
    return;
  }
  if (a === "stop"){ clearInterval(run.iv); run.phase = "done"; drawRunner(); return; }
  if (a === "save"){
    const n = parseInt(document.getElementById("runval").value, 10);
    if (isNaN(n) || n <= 0){ toast("Enter how many reps you got."); return; }
    const k = run.k, ex = run.ex, prev = k > 1 ? (tests[me+"|"+(k-1)] || {})[ex] || 0 : 0;

    saveTest(k, ex, n).then(() => render());

    celebrate("mid"); sfx("done");
    const e = EX.find(z => z.id === ex);
    if (prev && n > prev) hype(`+${n - prev}`, `${e.name} · +${(n-prev)*TEST_PTS} pts`);
    else hype(`${n}`, `${e.name} in 2 minutes${k === 1 ? " · baseline set" : ""}`);
    announceBadges(b0);
  }
}

// Check-ins are encrypted on the phone with a key made from the family wall password, so the
// database only ever holds scrambled text. Without the password there is nothing to read.
const WALL_CHECK = "6673f5dbee130968493a0f4eaf7f27b3bbe9ddae01008c5610564aa81d010caa";   // sha256("fifty-deep-wall:" + password)
const MOODS = [["rough","Rough"],["okay","Okay"],["good","Good"],["strong","Strong"],["unstoppable","Unstoppable"]];
const WEEKS_IN_SEASON = weekIdx(SEASON_END) + 1;                 // 5 (Mon–Sun weeks touching the season)
const ciOpens = w => { const sun = addDays(weekStart(w), 6); return sun > SEASON_END ? SEASON_END : sun; };   // Sunday, or Day 30
const ciCloses = () => addDays(SEASON_END, 4);
let checkins = {};            // "keith|1" -> { iv, ct, createdAt, updatedAt }
let checkinsCol = null;
let wallKey = null, wallPw = LS.get("fd_wall", "");
const wallCache = {};         // key|updatedAt -> decrypted object
let ciSheet = null;           // { w, photo, mood, a, b, c, saving }
const u8 = s => new TextEncoder().encode(s);
const toB64 = buf => { let s = ""; const b = new Uint8Array(buf); for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(s); };
const fromB64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function sha256hex(s){ const h = await crypto.subtle.digest("SHA-256", u8(s)); return [...new Uint8Array(h)].map(b => b.toString(16).padStart(2,"0")).join(""); }
async function unlockWall(pw){
  const norm = (pw || "").trim().toLowerCase();
  if (!norm || await sha256hex("fifty-deep-wall:" + norm) !== WALL_CHECK) return false;
  const base = await crypto.subtle.importKey("raw", u8(norm), "PBKDF2", false, ["deriveKey"]);
  wallKey = await crypto.subtle.deriveKey({ name:"PBKDF2", salt:u8("fifty-deep-wall-v1"), iterations:150000, hash:"SHA-256" }, base, { name:"AES-GCM", length:256 }, false, ["encrypt","decrypt"]);
  wallPw = norm; LS.set("fd_wall", norm);
  if (!pinOK){ pinOK = true; LS.set("fd_pin", norm); }
  return true;
}
async function sealEntry(obj){ const iv = crypto.getRandomValues(new Uint8Array(12)); const ct = await crypto.subtle.encrypt({ name:"AES-GCM", iv }, wallKey, u8(JSON.stringify(obj))); return { iv: toB64(iv), ct: toB64(ct) }; }
async function unsealEntry(e){ const pt = await crypto.subtle.decrypt({ name:"AES-GCM", iv: fromB64(e.iv) }, wallKey, fromB64(e.ct)); return JSON.parse(new TextDecoder().decode(pt)); }
function shrinkPhoto(file){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => { const max = 900, k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      let q = .72, out = c.toDataURL("image/jpeg", q); while (out.length > 520000 && q > .35){ q -= .1; out = c.toDataURL("image/jpeg", q); }
      res(out); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("That photo couldn't be opened. Try a different one.")); };
    img.src = url;
  });
}

function change(exId, newVal, opts = {}){
  if (!me || !canWrite) return;
  if (!pinOK){ pinOpen = true; render(); return; }
  if (!inSeason(selDate) || selDate > M.today){ toast(M.pre ? `Tip-off is ${fmtDate(SEASON_START)}. Save it for game day.` : "The season is over. Check the final standings."); return; }
  if (P[me].joined && selDate < P[me].joined){ toast("You joined after this day. Log from your first day on."); return; }
  const at = opts.el ? originOf(opts.el) : null; opts.el = at;
  const r0 = rankOf(me), ahead0 = standings("season").slice(0, rankOf(me) - 1);
  const x = M.players[me].days[selDate], e = EX.find(z => z.id === exId);
  const before = M.players[me].days[selDate];
  newVal = Math.max(0, Math.min(Math.round(newVal), x.cap[exId] === Infinity ? 99999 : x.cap[exId]));
  const old = x.v[exId];
  if (newVal === old) return;
  const beforeFull = before.full, beforeGoal = old >= (x.wk ? e.target : e.target + x.need[exId]);
  const prevRecovered = M.players[me].days[addDays(selDate,-1)]?.recovered;
  const b0 = earnedIds(me);
  const m0 = meta(me, selDate), now = Date.now(), nv = { ...x.v, [exId]: newVal };
  const v = { ...nv, gainAt: newVal > old ? now : m0.gainAt, fullAt: m0.fullAt || (full(nv) ? now : 0) };
  if (!full(nv)) v.fullAt = 0;
  setVals(me, selDate, v);
  if (opts.pop != null) popAt = { ex: exId, i: opts.pop };
  const goal = x.wk ? e.target : e.target + x.need[exId];
  const up = newVal > old;
  if (up && !beforeGoal && newVal >= goal) slamEx = exId;
  render();
  const nx = M.players[me].days[selDate];
  if (!up) { sfx("down"); lastRank = rankOf(me); return; }
  buzz(15);
  // did this rep move you up the leaderboard?
  const r1 = rankOf(me), passed = ahead0.filter(q => rankOf(q) > r1);
  const rankUp = r1 < r0 && passed.length > 0;
  lastRank = r1;
  const later = rankUp ? () => rankUpFx(r1, passed) : null;
  let queued = 0;
  const nowRecovered = M.players[me].days[addDays(selDate,-1)]?.recovered;
  if (!beforeFull && nx.full && (!nx.comeback || nowRecovered)) { fullDay(nx); queued = 2700; }
  else if (!prevRecovered && nowRecovered){ celebrate("big"); hype("Comeback", `${DNL[dow(addDays(selDate,-1))]} recovered · streak saved`); sfx("full"); queued = 2700; }
  else if (later) { later(); announceBadges(b0, 2700); return; }
  else if (slamEx || (up && !beforeGoal && newVal >= goal)) { celebrate("mid", opts.el); sfx("done"); buzz([20,40,30]); hype(cheer(), `${e.name} done · ${e.unit === "min" ? "rope" : e.target + " deep"}`); queued = 2700; }
  else if (x.wk && Math.floor(newVal/50) > Math.floor(old/50)) { celebrate("mid", opts.el); hype(`${newVal}`, `${e.name.toLowerCase()} today · bonus`); sfx("done"); queued = 2700; }
  else { celebrate("small", opts.el); sfx("tick"); }
  if (later) setTimeout(later, queued);
  announceBadges(b0, queued + (later ? 2700 : 0));
}
/* Standings. Tied on points? Whoever finished today's work first ranks higher, then whoever reached that score first. */
function standings(mode = "season", w = weekIdx(M.today)){
  const pts = p => mode === "week" ? M.players[p].weekPts[w] : M.players[p].seasonPts;
  const fin = p => M.players[p].fullAtToday || Infinity;
  const got = p => (mode === "week" ? M.players[p].weekGain(w) : M.players[p].lastGain) || Infinity;
  return PIDS().slice().sort((a,b) => (pts(b) - pts(a)) || (fin(a) - fin(b)) || (got(a) - got(b)) || (P[a].order - P[b].order));
}
function rankOf(p){ if (!M || !M.players[p]) return 99; return standings("season").indexOf(p) + 1; }
function rankUpFx(r, passed){
  const T = pc(me), names = passed.map(q => P[q].name);

}

  if (t.id === "tstart"){ startTimer(t); return; }

});

/* one generator per team; size: small (a set), mid (an exercise done), big (full day / moved up) */

  storm(size, o, T){
    const drops = size === "big" ? 160 : size === "mid" ? 60 : 18;

      add({ kind:"drop", x, y, vx:-1.2, vy:R(9,15), g:.2, c:pick(["#7C80F0","#A9ACFF","#F37021","#FFFFFF"]), life: size === "small" ? 26 : 90 });
    }

      const bx = size === "mid" ? o.x + R(-30,30) : R(W()*.15, W()*.85);

  },
  lancers(size, o, T){
    const n = size === "big" ? 12 : size === "mid" ? 4 : 0;
    for (let i = 0; i < n; i++) setTimeout(() => {
      const fromLeft = size === "mid" ? true : i % 2 === 0, y = size === "mid" ? o.y + R(-40,40) : R(H()*.15, H()*.85);
      add({ kind:"lance", x: fromLeft ? -140 : W()+140, y, vx: fromLeft ? R(18,24) : -R(18,24), vy: fromLeft ? -R(0,2) : R(0,2), c:pick(["#FFFFFF","#6CACE4","#B9DCF5"]), flag:pick(["#0B2545","#6CACE4"]), life:70 });

      add({ kind:"shield", x: size === "big" ? W()/2 : o.x, y: size === "big" ? H()*.42 : o.y, s: size === "big" ? 2.4 : 1.2, life: size === "big" ? 80 : 50 }); }
    confetti(size === "small" ? 16 : size === "mid" ? 40 : 110, o, T.colors, 1, [2,7], .16, 80);
  },
  bombers(size, o, T){
    if (size !== "small"){
      const drops = size === "big" ? [.15,.32,.5,.68,.85].map(f => ({ x: W()*f, ty: R(H()*.4, H()*.75) })) : [{ x: o.x, ty: o.y }];
      add({ kind:"plane", x:-90, y: size === "big" ? 80 : Math.max(60, o.y - 220), vx: (W() + 200) / (60 * 2.9), drops, life:400, s: size === "big" ? 1.6 : 1.1 });
    }
    if (size === "small"){ confetti(18, o, ["#E3262F","#111111","#FF8A3D","#FFFFFF"], 1, [2,6], .2, 40); add({ kind:"ring", x:o.x, y:o.y, r:6, vr2:5, c:"#E3262F", life:22 }); }
  },
  gamers(size, o, T){
    const n = size === "big" ? 140 : size === "mid" ? 60 : 20;
    for (let i = 0; i < n; i++){
      const a = Math.random()*Math.PI*2, sp = size === "big" ? R(3,9) : R(2,6);
      const ox = size === "big" ? R(0, W()) : o.x, oy = size === "big" ? R(-40, H()*.3) : o.y;
      add({ kind:"pixel", x:ox, y:oy, vx: Math.round(Math.cos(a)*sp), vy: Math.round(Math.sin(a)*sp) - (size === "big" ? 0 : 2), g: .25, w:[6,8,10][i%3], c:pick(T.colors), life:R(40,80) });
    }
    add({ kind:"text", x:o.x, y:o.y - 20, vy:-1.6, text: size === "small" ? "+10" : size === "mid" ? "+XP" : "LEVEL UP", c:"#86EFAC", life:60, size: size === "big" ? 34 : 20 });

            drift: size === "big" ? R(-1.2,1.2) : 0, c:pick(T.colors), w:R(3,7), life:R(60,110) });

      add({ kind:"paw", x, y, rot, c: i % 3 === 2 ? "#F5C542" : "#3B6CF6", life:70, s: size === "big" ? 1.3 : 1 });
    }, i * (size === "big" ? 120 : 90));
    confetti(size === "small" ? 12 : size === "mid" ? 40 : 120, o, T.colors, 1, [2,7], .18, 80);
  },
  confetti(size, o, T){
    if (size === "big"){ for (let i = 0; i < 200; i++){ const a = -Math.PI/2 + R(-.7,.7), sp = R(9,19);
      add({ x: i%2 ? W()*.15 : W()*.85, y:H(), vx:Math.cos(a)*sp + (i%2 ? 3 : -3), vy:Math.sin(a)*sp, g:.28, w:R(5,11), h:R(3,11), rot:R(0,6), vr:R(-.4,.4), c:pick(T.colors.concat(["#FF7A1A"])), life:160 }); } }
    else confetti(size === "mid" ? 90 : 22, o, T.colors.concat(["#FF7A1A"]), 1, size === "mid" ? [4,11] : [2,5], size === "mid" ? .28 : .12, size === "mid" ? 150 : 40);

function drawBolt(p){
  cx.save(); cx.globalAlpha = p.life % 4 < 2 ? 1 : .55; cx.strokeStyle = p.c; cx.lineWidth = 4; cx.shadowColor = p.c; cx.shadowBlur = 18;
  let x = p.x, y = p.y, s = p.seed; cx.beginPath(); cx.moveTo(x, y);
  while (y < p.to){ s = (s * 9301 + 49297) % 233280 / 233280; x += (s - .5) * 60; y += 24 + s * 20; cx.lineTo(x, y); }
  cx.stroke(); cx.lineWidth = 1.5; cx.strokeStyle = "#FFFFFF"; cx.stroke(); cx.restore();
}
function drawPlane(p){
  cx.save(); cx.translate(p.x, p.y); cx.rotate(Math.PI/2); cx.scale(p.s, p.s);
  cx.fillStyle = "rgba(0,0,0,.35)"; cx.beginPath(); cx.moveTo(4,-26); cx.lineTo(26,-4); cx.lineTo(16,-4); cx.lineTo(10,2); cx.lineTo(4,-3); cx.lineTo(-2,2); cx.lineTo(-8,-4); cx.lineTo(-18,-4); cx.closePath(); cx.fill();
  cx.fillStyle = "#8A8F98"; cx.strokeStyle = "#111"; cx.lineWidth = 1.5;
  cx.beginPath(); cx.moveTo(0,-30); cx.lineTo(24,-8); cx.lineTo(14,-8); cx.lineTo(8,-2); cx.lineTo(0,-7); cx.lineTo(-8,-2); cx.lineTo(-14,-8); cx.lineTo(-24,-8); cx.closePath(); cx.fill(); cx.stroke();
  cx.fillStyle = "#E3262F"; cx.beginPath(); cx.moveTo(0,-30); cx.lineTo(5,-16); cx.lineTo(-5,-16); cx.closePath(); cx.fill();
  cx.restore();
}
function drawShield(p){
  const t = 1 - p.life / p.max, a = p.life < 20 ? p.life / 20 : 1, sc = p.s * (t < .15 ? 2.2 - t * 8 : 1);
  cx.save(); cx.globalAlpha = a; cx.translate(p.x, p.y); cx.scale(sc, sc);
  cx.shadowColor = "#6CACE4"; cx.shadowBlur = 24;
  cx.fillStyle = "#0B2545"; cx.strokeStyle = "#6CACE4"; cx.lineWidth = 4;
  cx.beginPath(); cx.moveTo(0,-34); cx.lineTo(28,-24); cx.lineTo(28,-2); cx.bezierCurveTo(28,18,14,30,0,36); cx.bezierCurveTo(-14,30,-28,18,-28,-2); cx.lineTo(-28,-24); cx.closePath(); cx.fill(); cx.stroke();
  cx.shadowBlur = 0; cx.strokeStyle = "#FFFFFF"; cx.lineWidth = 3.5; cx.beginPath(); cx.moveTo(0,26); cx.lineTo(0,-16); cx.stroke();
  cx.fillStyle = "#FFFFFF"; cx.beginPath(); cx.moveTo(0,-26); cx.lineTo(-7,-14); cx.lineTo(7,-14); cx.closePath(); cx.fill();
  cx.strokeStyle = "#6CACE4"; cx.lineWidth = 3; cx.beginPath(); cx.moveTo(-12,2); cx.lineTo(12,2); cx.stroke();
  cx.restore();
}
function drawPaw(p){
  const a = Math.min(1, p.life / 25), sc = p.s * (p.life > p.max - 8 ? 1.4 - (p.max - p.life) * .05 : 1);
  cx.save(); cx.globalAlpha = a; cx.translate(p.x, p.y); cx.rotate(p.rot); cx.scale(sc, sc); cx.fillStyle = p.c;
  cx.beginPath(); cx.ellipse(0, 6, 11, 9, 0, 0, 7); cx.fill();
  [[-11,-6],[-4,-12],[4,-12],[11,-6]].forEach(([tx,ty]) => { cx.beginPath(); cx.ellipse(tx, ty, 4, 5, 0, 0, 7); cx.fill(); });
  cx.restore();
}
function explode(p){
  const o = { x:p.x, y:p.y };
  confetti(70, o, ["#E3262F","#111111","#FF8A3D","#FFD166","#FFFFFF"], 1.4, [3,10], .22, 70);
  add({ kind:"ring", x:o.x, y:o.y, r:8, vr2:9, c:"#FF8A3D", life:30 });
  add({ kind:"ring", x:o.x, y:o.y, r:4, vr2:6, c:"#E3262F", life:34 });
  flash("rgba(255,120,40,.45)", 200); shake(); teamSound("boom"); buzz(40);
}
function tick(){
  const d = devicePixelRatio; cx.setTransform(d,0,0,d,0,0); cx.clearRect(0,0,W(),H());
  const next = [];
  for (const p of parts){
    p.life--;
    if (p.kind === "swirl"){
      p.ang += p.spin; p.h = Math.min(1.05, p.h + .006); p.cx += p.drift;
      const r = 10 + p.top * p.h, x = p.cx + Math.cos(p.ang) * r, y = p.base - p.h * p.height + Math.sin(p.ang) * r * .18;
      p.x = x; p.y = y;
      cx.globalAlpha = Math.min(1, p.life / 30); cx.fillStyle = p.c; cx.fillRect(x - p.w/2, y - p.w/4, p.w, p.w/2);
    } else if (p.kind === "bolt") { drawBolt(p); }
    else if (p.kind === "paw") { drawPaw(p); }
    else if (p.kind === "plane") {
      p.x += p.vx;
      while (p.drops.length && p.x >= p.drops[0].x){ const dp = p.drops.shift(); add({ kind:"bomb", x:dp.x, y:p.y + 12, vx:p.vx*.25, vy:1, g:.5, ty:dp.ty, life:200 }); teamSound("drop", "_bombers"); }
      drawPlane(p); if (p.x > W() + 120) continue;
    }
    else if (p.kind === "shield") { drawShield(p); }
    else if (p.kind === "ring") {
      p.r += p.vr2; cx.globalAlpha = Math.max(0, p.life / p.max); cx.strokeStyle = p.c; cx.lineWidth = 4; cx.beginPath(); cx.arc(p.x, p.y, p.r, 0, 7); cx.stroke();
    } else if (p.kind === "text") {
      p.y += p.vy; cx.globalAlpha = Math.min(1, p.life / 20); cx.fillStyle = p.c; cx.font = `900 ${p.size}px "Big Shoulders Display", Impact, sans-serif`; cx.textAlign = "center"; cx.fillText(p.text, p.x, p.y);
    } else {
      p.vy += p.g; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      if (p.kind === "bomb" && p.y >= p.ty){ explode(p); continue; }
      cx.save(); cx.globalAlpha = Math.min(1, p.life / 25); cx.translate(p.x, p.y);
      if (p.kind === "drop"){ cx.strokeStyle = p.c; cx.lineWidth = 2; cx.beginPath(); cx.moveTo(0,0); cx.lineTo(p.vx*1.2, -14); cx.stroke(); }
      else if (p.kind === "lance"){ const dir = Math.sign(p.vx); cx.scale(dir, 1); cx.strokeStyle = p.c; cx.lineWidth = 3; cx.beginPath(); cx.moveTo(-120,0); cx.lineTo(0,0); cx.stroke();
        cx.fillStyle = p.c; cx.beginPath(); cx.moveTo(18,0); cx.lineTo(0,-6); cx.lineTo(0,6); cx.fill();
        cx.fillStyle = p.flag; cx.beginPath(); cx.moveTo(-96,0); cx.lineTo(-76,-14); cx.lineTo(-76,0); cx.fill(); }
      else if (p.kind === "bomb"){ cx.fillStyle = "#111"; cx.beginPath(); cx.arc(0,0,11,0,7); cx.fill(); cx.strokeStyle = "#E3262F"; cx.lineWidth = 2; cx.stroke();
        cx.fillStyle = "#FFD166"; cx.beginPath(); cx.arc(6,-13,3 + Math.random()*2,0,7); cx.fill(); }
      else if (p.kind === "pixel"){ const s = p.w; cx.fillStyle = p.c; cx.fillRect(Math.round(-s/2/2)*2, Math.round(-s/2/2)*2, s, s); }
      else { cx.rotate(p.rot); cx.fillStyle = p.c; cx.fillRect(-p.w/2, -p.h/2, p.w, p.h); }
      cx.restore();
      if (p.y > H() + 60 && p.kind !== "lance") continue;
    }
    if (p.life > 0 && p.x > -300 && p.x < W() + 300) next.push(p);
  }
  cx.globalAlpha = 1; parts = next;
  raf = parts.length ? requestAnimationFrame(tick) : (cx.clearRect(0,0,W(),H()), null);
}
